# Wire-format mapping for SchemaJournalEntry — the §2.4 schema journal chain.
#
# Cross-stack consumer reference. Non-Rust consumers decode the
# Content TLV stream of a `/<operator>/schema/seq=N` Data packet using
# the tag table below.
#
# Defined in: crates/tooling/ndn-dashboard/src/security_chains.rs
# Chain primitive: crates/tooling/ndn-dashboard/src/signed_data_chain.rs

type    = "SchemaJournalEntry"
schema_version = 1

# Reserved tags — see audit-log-entry.toml for the shared table.
[[reserved]]
tag  = 0
name = "schema_version"
rust_type = "u16"
wire_type = "NonNegativeInteger (1/2/4/8 BE bytes)"

[[reserved]]
tag  = 1
name = "authored_under"
rust_type = "Option<[u8; 32]>"
wire_type = "0 or 32 raw bytes"

[[reserved]]
tag  = 2
name = "prev_entry_hash"
rust_type = "[u8; 32]"
wire_type = "32 raw bytes (SHA-256)"

# Type-defined tags (start at tag::PAYLOAD_START = 3).

[[fields]]
tag  = 3
name = "ts_unix_ns"
rust_type = "u64"
wire_type = "NonNegativeInteger (1/2/4/8 BE bytes)"
notes = "Unix-epoch nanoseconds — when the dashboard observed the change."

[[fields]]
tag  = 4
name = "kind"
rust_type = "SchemaJournalKind (enum)"
wire_type = "1 byte"
notes = """\
Encoded values:
  0 = AnchorAdd
  1 = AnchorRemove
  2 = SchemaRuleAdd
  3 = SchemaRuleRemove"""

[[fields]]
tag  = 5
name = "subject_name"
rust_type = "String"
wire_type = "UTF-8 bytes"
notes = "NDN-name URI of the anchor or rule affected (e.g. '/lab/router-ca/KEY/k0')."

[[fields]]
tag  = 6
name = "initiator_name"
rust_type = "String"
wire_type = "UTF-8 bytes"
notes = """\
NDN-name URI of the identity that initiated the change (the verb
signer; mirrors the §3.1 identity-chip's active identity)."""
