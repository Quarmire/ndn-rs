# Wire-format mapping for AuditLogEntry — the §4.6 audit log chain.
#
# Cross-stack consumer reference. Non-Rust consumers decode the
# Content TLV stream of a `/<operator>/audit/seq=N` Data packet using
# the tag table below. The chain primitive's reserved tags (0, 1, 2)
# precede the type-defined tags listed here.
#
# Defined in: crates/tooling/ndn-dashboard/src/security_chains.rs
# Chain primitive: crates/tooling/ndn-dashboard/src/signed_data_chain.rs

type    = "AuditLogEntry"
schema_version = 1

# Reserved tags — handled by SignedDataChainStore. Listed for completeness;
# omit when consuming the per-type payload reader.
[[reserved]]
tag  = 0
name = "schema_version"
rust_type = "u16"
wire_type = "NonNegativeInteger (1/2/4/8 BE bytes)"
notes = "Always equals this file's schema_version. Mismatch fails chain verification."

[[reserved]]
tag  = 1
name = "authored_under"
rust_type = "Option<[u8; 32]>"
wire_type = "0 or 32 raw bytes"
notes = "v1: always 0-length (None). v2 may carry a SemanticManifest content_hash."

[[reserved]]
tag  = 2
name = "prev_entry_hash"
rust_type = "[u8; 32]"
wire_type = "32 raw bytes (SHA-256)"
notes = "ImplicitSha256Digest of the prior entry's full Data wire; [0u8; 32] at seq=0."

# Type-defined tags (start at tag::PAYLOAD_START = 3).

[[fields]]
tag  = 3
name = "ts_unix_ns"
rust_type = "u64"
wire_type = "NonNegativeInteger (1/2/4/8 BE bytes)"
notes = "Unix-epoch nanoseconds. Matches NDN's TIMESTAMP convention."

[[fields]]
tag  = 4
name = "outcome"
rust_type = "AuditOutcome (enum)"
wire_type = "1 byte"
notes = "Encoded values: 0=Accepted, 1=Rejected, 2=Info, 3=Warning."

[[fields]]
tag  = 5
name = "subject"
rust_type = "String"
wire_type = "UTF-8 bytes"
notes = """\
Verb-ish subject identifier. Convention: '<module>/<verb>' (e.g.
'security/policy-set', 'rib/register', 'security/anchor-add')."""

[[fields]]
tag  = 6
name = "detail"
rust_type = "String"
wire_type = "UTF-8 bytes, recommended <= 512 bytes"
notes = """\
Free-form detail line. For audit-bridge entries from policy-set, the
format is 'initiator=<name> policy_content_hash=<hex64>'."""
