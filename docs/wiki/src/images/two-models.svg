<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Two models: the host/connection model versus the name/data model">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6f6f6f"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#78a9ff"/></marker>
  </defs>

  <rect width="980" height="430" fill="#161616"/>
  <text x="32" y="40" fill="#f4f4f4" font-size="22" font-weight="600">Two models</text>
  <text x="32" y="62" fill="#a8a8a8" font-size="13">NDN flips what you ask for and where trust lives. Everything else follows from this.</text>

  <!-- LEFT: host model (being unlearned — muted) -->
  <rect x="32" y="84" width="430" height="300" fill="#1c1c1c" stroke="#393939"/>
  <text x="52" y="116" fill="#6f6f6f" font-size="12" letter-spacing="1.5">HOST MODEL · WHAT YOU ALREADY KNOW</text>

  <rect x="52" y="140" width="120" height="62" fill="#262626" stroke="#525252"/>
  <text x="68" y="166" fill="#a8a8a8" font-size="13" font-weight="600">Your app</text>
  <text x="68" y="186" fill="#6f6f6f" font-size="11">opens a connection</text>

  <rect x="322" y="140" width="120" height="62" fill="#262626" stroke="#525252"/>
  <text x="338" y="166" fill="#a8a8a8" font-size="13" font-weight="600">Server</text>
  <text x="338" y="186" fill="#6f6f6f" font-size="11" font-family="'IBM Plex Mono', monospace">203.0.113.5</text>

  <path d="M172 171 L322 171" stroke="#6f6f6f" stroke-width="1.5" fill="none" marker-end="url(#g)"/>
  <text x="247" y="160" fill="#6f6f6f" font-size="10" text-anchor="middle">TLS</text>

  <rect x="52" y="250" width="390" height="58" fill="#262626" stroke="#525252"/>
  <text x="68" y="274" fill="#a8a8a8" font-size="12" font-weight="600">You address a place.</text>
  <text x="68" y="294" fill="#6f6f6f" font-size="11">Trust = the connection. Move the data, lose the trust.</text>

  <!-- the inversion -->
  <text x="483" y="230" fill="#4589ff" font-size="11" text-anchor="middle" letter-spacing="1.5">THE</text>
  <text x="483" y="248" fill="#4589ff" font-size="11" text-anchor="middle" letter-spacing="1.5">FLIP</text>
  <path d="M466 200 L500 200" stroke="#4589ff" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- RIGHT: data model (NDN — accent) -->
  <rect x="518" y="84" width="430" height="300" fill="#1c1c1c" stroke="#4589ff"/>
  <text x="538" y="116" fill="#78a9ff" font-size="12" letter-spacing="1.5">DATA MODEL · NDN</text>

  <rect x="538" y="140" width="120" height="62" fill="#262626" stroke="#525252"/>
  <text x="554" y="166" fill="#f4f4f4" font-size="13" font-weight="600">Your app</text>
  <text x="554" y="186" fill="#78a9ff" font-size="11">asks for a name</text>

  <rect x="808" y="140" width="120" height="62" fill="#262626" stroke="#525252"/>
  <text x="824" y="160" fill="#f4f4f4" font-size="12" font-weight="600">Whoever</text>
  <text x="824" y="178" fill="#a8a8a8" font-size="11">has it: a cache,</text>
  <text x="824" y="193" fill="#a8a8a8" font-size="11">a peer, the source</text>

  <path d="M658 171 L808 171" stroke="#78a9ff" stroke-width="1.5" fill="none" marker-end="url(#b)"/>
  <text x="733" y="160" fill="#78a9ff" font-size="10" text-anchor="middle" font-family="'IBM Plex Mono', monospace">/alice/photo</text>

  <rect x="538" y="250" width="390" height="58" fill="#022d0d" stroke="#42be65"/>
  <text x="554" y="274" fill="#42be65" font-size="12" font-weight="600">You name a thing.</text>
  <text x="554" y="294" fill="#a7f0ba" font-size="11">Trust = the signed bytes. The data is secure anywhere.</text>

  <text x="538" y="350" fill="#a8a8a8" font-size="12">Caching, faces, strategies, the PIT —</text>
  <text x="538" y="368" fill="#a8a8a8" font-size="12">all consequences of this one flip.</text>
</svg>
