<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="The forwarding pipeline: an Interest is decoded, checked against the Content Store and PIT, handed to a strategy that consults the FIB, and forwarded; the Data returns along the reverse path recorded in the PIT.">
  <!-- Carbon dashboard tokens (styles.rs): #161616 bg, blue-40 #78a9ff for the
       Interest path, green-40 #42be65 for the Data return. A moving token
       animates the packet's walk through the stages; animation is pure
       SMIL + CSS so it renders in mdBook AND directly on GitHub. -->
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#78a9ff"/>
    </marker>
    <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#42be65"/>
    </marker>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .tok { display: none; }
      }
    </style>
  </defs>

  <rect width="980" height="520" fill="#161616"/>

  <text x="32" y="40" fill="#f4f4f4" font-size="22" font-weight="600">The forwarding pipeline</text>
  <text x="32" y="62" fill="#a8a8a8" font-size="13">One Interest in; at most one Data out. Every stage can short-circuit — a Content Store hit answers without the rest running.</text>

  <!-- ── Interest ingress row ───────────────────────────────────────────── -->
  <text x="32" y="104" fill="#6f6f6f" font-size="11" letter-spacing="1.5">INTEREST · CONSUMER → ENGINE</text>

  <!-- Face -->
  <rect x="32" y="120" width="120" height="64" fill="#262626" stroke="#525252"/>
  <text x="48" y="146" fill="#f4f4f4" font-size="13" font-weight="600">Face</text>
  <text x="48" y="166" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">recv bytes</text>

  <!-- Decode -->
  <rect x="192" y="120" width="120" height="64" fill="#262626" stroke="#525252"/>
  <text x="208" y="146" fill="#f4f4f4" font-size="13" font-weight="600">Decode</text>
  <text x="208" y="166" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">LP → TLV</text>

  <!-- CS -->
  <rect x="352" y="120" width="120" height="64" fill="#262626" stroke="#525252"/>
  <text x="368" y="146" fill="#f4f4f4" font-size="13" font-weight="600">CS</text>
  <text x="368" y="166" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">cache hit?</text>

  <!-- PIT -->
  <rect x="512" y="120" width="120" height="64" fill="#262626" stroke="#525252"/>
  <text x="528" y="146" fill="#f4f4f4" font-size="13" font-weight="600">PIT</text>
  <text x="528" y="166" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">aggregate</text>

  <!-- Strategy -->
  <rect x="672" y="120" width="120" height="64" fill="#262626" stroke="#525252"/>
  <text x="688" y="146" fill="#f4f4f4" font-size="13" font-weight="600">Strategy</text>
  <text x="688" y="166" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">decide</text>

  <!-- FIB -->
  <rect x="832" y="120" width="116" height="64" fill="#262626" stroke="#525252"/>
  <text x="848" y="146" fill="#f4f4f4" font-size="13" font-weight="600">FIB</text>
  <text x="848" y="166" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">LPM nexthop</text>

  <!-- Interest path connectors -->
  <line x1="152" y1="152" x2="190" y2="152" stroke="#78a9ff" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="312" y1="152" x2="350" y2="152" stroke="#78a9ff" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="472" y1="152" x2="510" y2="152" stroke="#78a9ff" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="632" y1="152" x2="670" y2="152" stroke="#78a9ff" stroke-width="2" marker-end="url(#pa)"/>
  <line x1="792" y1="152" x2="830" y2="152" stroke="#78a9ff" stroke-width="2" marker-end="url(#pa)"/>

  <!-- Interest token walking the ingress path -->
  <circle class="tok" r="6" fill="#78a9ff">
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;0.16;0.34;0.52;0.70;0.88;1"
      keyTimes="0;0.14;0.30;0.48;0.66;0.84;1" calcMode="linear"
      path="M 92 152 L 252 152 L 412 152 L 572 152 L 732 152 L 890 152 L 890 152"/>
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite"
      keyTimes="0;0.05;0.86;0.9;1" values="0;1;1;0;0"/>
  </circle>

  <!-- ── Egress + Data return ───────────────────────────────────────────── -->
  <text x="32" y="250" fill="#6f6f6f" font-size="11" letter-spacing="1.5">DATA · PRODUCER → ENGINE → CONSUMER (REVERSE PATH)</text>

  <!-- Producer -->
  <rect x="832" y="266" width="116" height="64" fill="#1c2b1c" stroke="#42be65"/>
  <text x="848" y="292" fill="#f4f4f4" font-size="13" font-weight="600">Producer</text>
  <text x="848" y="312" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">signs Data</text>

  <!-- PIT match -->
  <rect x="512" y="266" width="120" height="64" fill="#1c2b1c" stroke="#42be65"/>
  <text x="528" y="292" fill="#f4f4f4" font-size="13" font-weight="600">PIT match</text>
  <text x="528" y="312" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">in-records</text>

  <!-- Validate -->
  <rect x="352" y="266" width="120" height="64" fill="#1c2b1c" stroke="#42be65"/>
  <text x="368" y="292" fill="#f4f4f4" font-size="13" font-weight="600">Validate</text>
  <text x="368" y="312" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">verify sig</text>

  <!-- CS insert -->
  <rect x="192" y="266" width="120" height="64" fill="#1c2b1c" stroke="#42be65"/>
  <text x="208" y="292" fill="#f4f4f4" font-size="13" font-weight="600">CS insert</text>
  <text x="208" y="312" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">cache</text>

  <!-- Consumer -->
  <rect x="32" y="266" width="120" height="64" fill="#1c2b1c" stroke="#42be65"/>
  <text x="48" y="292" fill="#f4f4f4" font-size="13" font-weight="600">Consumer</text>
  <text x="48" y="312" fill="#8d8d8d" font-size="11" font-family="'IBM Plex Mono', monospace">SafeData</text>

  <!-- Data path connectors (right → left) -->
  <line x1="832" y1="298" x2="634" y2="298" stroke="#42be65" stroke-width="2" marker-end="url(#ga)"/>
  <line x1="512" y1="298" x2="474" y2="298" stroke="#42be65" stroke-width="2" marker-end="url(#ga)"/>
  <line x1="352" y1="298" x2="314" y2="298" stroke="#42be65" stroke-width="2" marker-end="url(#ga)"/>
  <line x1="192" y1="298" x2="154" y2="298" stroke="#42be65" stroke-width="2" marker-end="url(#ga)"/>

  <!-- FIB → Producer (egress of the forwarded Interest) -->
  <path d="M890 184 L890 266" stroke="#78a9ff" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pa)"/>
  <text x="900" y="228" fill="#6f6f6f" font-size="10">forward</text>

  <!-- Data token walking the reverse path -->
  <circle class="tok" r="6" fill="#42be65">
    <animateMotion dur="4s" begin="1.2s" repeatCount="indefinite" calcMode="linear"
      keyPoints="0;0.2;0.4;0.6;0.8;1" keyTimes="0;0.2;0.4;0.6;0.8;1"
      path="M 890 298 L 572 298 L 412 298 L 252 298 L 92 298"/>
    <animate attributeName="opacity" dur="4s" begin="1.2s" repeatCount="indefinite"
      keyTimes="0;0.05;0.92;0.97;1" values="0;1;1;0;0"/>
  </circle>

  <!-- ── Legend / invariants ────────────────────────────────────────────── -->
  <line x1="32" y1="392" x2="948" y2="392" stroke="#393939" stroke-width="1"/>

  <circle cx="40" cy="424" r="5" fill="#78a9ff"/>
  <text x="54" y="428" fill="#c6c6c6" font-size="12">Interest walks ingress stages; any stage may short-circuit (CS hit, PIT aggregate, Nack).</text>

  <circle cx="40" cy="452" r="5" fill="#42be65"/>
  <text x="54" y="456" fill="#c6c6c6" font-size="12">Data returns along the reverse path the PIT recorded — no routing needed on the way back.</text>

  <text x="40" y="490" fill="#6f6f6f" font-size="11">Flow balance: one Interest consumes one PIT entry and is satisfied by at most one Data. Stateful forwarding is what makes the return path free.</text>
</svg>
