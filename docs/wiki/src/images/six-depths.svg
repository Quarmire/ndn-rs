<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="One packet, six depths — an Interest asks for a name and signed Data returns through the engine">
  <!-- Carbon-styled, dashboard tokens (styles.rs). Dark theme, square
       corners, blue-40 Interest path, green Data return, trust badge. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#78a9ff"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#42be65"/>
    </marker>
  </defs>

  <rect width="980" height="460" fill="#161616"/>

  <text x="32" y="42" fill="#f4f4f4" font-size="22" font-weight="600">One packet, six depths</text>
  <text x="32" y="64" fill="#a8a8a8" font-size="13">An Interest asks for a name; signed Data comes back. Read deeper only as far as you need.</text>

  <text x="32" y="98" fill="#6f6f6f" font-size="11" letter-spacing="1.5">DEPTH 1 · YOU FETCH A NAME, NOT A SERVER</text>

  <!-- Consumer -->
  <rect x="32" y="112" width="150" height="78" fill="#262626" stroke="#525252"/>
  <text x="48" y="138" fill="#f4f4f4" font-size="14" font-weight="600">Consumer</text>
  <text x="48" y="160" fill="#78a9ff" font-size="12" font-family="'IBM Plex Mono', monospace">fetch_object(</text>
  <text x="48" y="176" fill="#78a9ff" font-size="12" font-family="'IBM Plex Mono', monospace">  /alice/photo)</text>

  <!-- Engine container -->
  <rect x="262" y="100" width="470" height="252" fill="#1c1c1c" stroke="#393939"/>
  <text x="724" y="92" fill="#6f6f6f" font-size="11" letter-spacing="1.5" text-anchor="end">ndn-engine</text>

  <!-- CS / PIT / FIB+Strategy -->
  <rect x="286" y="124" width="190" height="60" fill="#262626" stroke="#525252"/>
  <text x="300" y="148" fill="#f4f4f4" font-size="13" font-weight="600">Content Store</text>
  <text x="300" y="168" fill="#a8a8a8" font-size="11">DEPTH 2 · a cache may answer</text>

  <rect x="286" y="196" width="190" height="60" fill="#262626" stroke="#525252"/>
  <text x="300" y="220" fill="#f4f4f4" font-size="13" font-weight="600">PIT</text>
  <text x="300" y="240" fill="#a8a8a8" font-size="11">DEPTH 3 · aggregates requests</text>

  <rect x="286" y="268" width="190" height="64" fill="#262626" stroke="#525252"/>
  <text x="300" y="292" fill="#f4f4f4" font-size="13" font-weight="600">FIB + Strategy</text>
  <text x="300" y="312" fill="#a8a8a8" font-size="11">DEPTH 4 · a decision, not a route</text>

  <!-- Face (egress) -->
  <rect x="512" y="196" width="196" height="60" fill="#262626" stroke="#4589ff"/>
  <text x="528" y="220" fill="#f4f4f4" font-size="13" font-weight="600">Face</text>
  <text x="528" y="240" fill="#78a9ff" font-size="11" font-family="'IBM Plex Mono', monospace">DEPTH 5 · UDP / BLE / shm</text>

  <!-- Producer -->
  <rect x="800" y="112" width="148" height="78" fill="#262626" stroke="#525252"/>
  <text x="816" y="138" fill="#f4f4f4" font-size="14" font-weight="600">Producer</text>
  <text x="816" y="160" fill="#a8a8a8" font-size="11">serves signed</text>
  <text x="816" y="176" fill="#a8a8a8" font-size="11">Data</text>

  <!-- Interest path (blue) -->
  <path d="M182 151 L286 151" stroke="#78a9ff" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <path d="M708 226 L800 170" stroke="#78a9ff" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Data return path (green) -->
  <path d="M800 150 L740 150 L740 380 L120 380 L120 190" stroke="#42be65" stroke-width="1.5" fill="none" marker-end="url(#arrG)"/>

  <!-- Trust badge: DEPTH 6 -->
  <rect x="286" y="396" width="430" height="44" fill="#022d0d" stroke="#42be65"/>
  <text x="304" y="416" fill="#42be65" font-size="12" font-weight="600">DEPTH 6 · signature checked against your trust schema</text>
  <text x="304" y="432" fill="#a7f0ba" font-size="11" font-family="'IBM Plex Mono', monospace">SafeData — the engine will not forward unverified Data</text>

  <!-- legend -->
  <line x1="770" y1="404" x2="794" y2="404" stroke="#78a9ff" stroke-width="2"/>
  <text x="800" y="408" fill="#a8a8a8" font-size="11">Interest</text>
  <line x1="770" y1="424" x2="794" y2="424" stroke="#42be65" stroke-width="2"/>
  <text x="800" y="428" fill="#a8a8a8" font-size="11">signed Data</text>
</svg>
