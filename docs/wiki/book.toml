[book]
title = "ndn-rs Wiki"
authors = ["ndn-rs contributors"]
language = "en"
src = "src"

[build]
build-dir = "../../target/wiki"

# Fail the build on any broken intra-book link or {{#include}} — this is what
# keeps the docs honest as code moves. External HTTP links are NOT followed
# (they are flaky and slow on a PR gate); the nightly lane checks those.
# Requires the `mdbook-linkcheck` binary on PATH wherever `mdbook build` runs
# (installed in both the CI `book` job and the wiki deploy).
[output.linkcheck]
follow-web-links = false
warning-policy = "error"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Quarmire/ndn-rs"
edit-url-template = "https://github.com/Quarmire/ndn-rs/edit/main/docs/wiki/{path}"
additional-css = ["theme/fonts.css", "theme/carbon.css"]
additional-js = ["mermaid-init.js", "d3graph-init.js"]

[output.html.fold]
enable = true
level = 1

# Mermaid is rendered client-side by mermaid-init.js (CDN mermaid@11 + ELK
# layout + Carbon theming). The mdbook-mermaid preprocessor only duplicated
# the fence detection and coupled the build to a matching mdbook version, so
# it was removed. See .claude/notes/wiki/ for the investigation.
