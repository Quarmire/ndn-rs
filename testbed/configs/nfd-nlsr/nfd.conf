; NFD config for nlsr-cxx sidecar.
;
; Socket is at /run/nfd-nlsr/nfd.sock so it doesn't collide with the
; compliance-test NFD service at /run/nfd/nfd.sock.  The nlsr-cxx
; container mounts the same volume and sets NDN_CLIENT_SOCK accordingly.

general
{
  ; No user/group drop in Docker.
}

log
{
  default_level INFO
}

forwarder
{
  default_hop_limit 0
}

tables
{
  cs_max_packets 4096
  cs_policy lru
  cs_unsolicited_policy drop-all

  strategy_choice
  {
    /              /localhost/nfd/strategy/best-route
    /localhost     /localhost/nfd/strategy/multicast
    /localhost/nfd /localhost/nfd/strategy/best-route
    ; localhop prefix uses multicast so NLSR sync Interests reach all peers on
    ; this NFD instance (nlsr-cxx AND ndn-fwd-nlsr) without requiring FIB
    ; pre-registration.  ndn-fwd-nlsr's private sync face is discovered via the
    ; IncomingFaceId on the first sync exchange, which C++ NLSR then uses as a
    ; NextHopFaceId for LSA fetch Interests.
    /localhop      /localhost/nfd/strategy/multicast
    /ndn/broadcast /localhost/nfd/strategy/multicast
  }
}

face_system
{
  unix
  {
    path /run/nfd-nlsr/nfd.sock
  }

  tcp
  {
    listen    yes
    port      6363
    enable_v4 yes
    enable_v6 no
  }

  udp
  {
    listen    yes
    port      6363
    enable_v4 yes
    enable_v6 no
    mcast     no
  }
}

authorizations
{
  authorize
  {
    certfile any
    privileges
    {
      faces
      fib
      cs
      strategy-choice
    }
  }
}

rib
{
  localhost_security
  {
    trust-anchor
    {
      type any
    }
  }

  prefix_announcement_validation
  {
    trust-anchor
    {
      type any
    }
  }

  readvertise_nlsr no
}
