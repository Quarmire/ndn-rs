; NFD config for the ndncert-ca sidecar.
;
; Socket is at /run/nfd-ndncert/nfd.sock so it does not collide with the
; compliance-test NFD service at /run/nfd/nfd.sock.  The ndncert-ca-server
; and the enrollment client both reach this NFD instance via the shared
; nfd-ndncert-sock volume.

general
{
  ; No user/group drop in Docker.
}

log
{
  default_level INFO
}

forwarder
{
  default_hop_limit 0
}

tables
{
  cs_max_packets 4096
  cs_policy lru
  cs_unsolicited_policy drop-all

  strategy_choice
  {
    /              /localhost/nfd/strategy/best-route
    /localhost     /localhost/nfd/strategy/multicast
    /localhost/nfd /localhost/nfd/strategy/best-route
  }
}

face_system
{
  unix
  {
    path /run/nfd-ndncert/nfd.sock
  }

  tcp
  {
    listen    yes
    port      6363
    enable_v4 yes
    enable_v6 no
  }

  udp
  {
    listen    yes
    port      6363
    enable_v4 yes
    enable_v6 no
    mcast     no
  }
}

authorizations
{
  authorize
  {
    certfile any
    privileges
    {
      faces
      fib
      cs
      strategy-choice
    }
  }
}

rib
{
  localhost_security
  {
    trust-anchor
    {
      type any
    }
  }

  prefix_announcement_validation
  {
    trust-anchor
    {
      type any
    }
  }

  readvertise_nlsr no
}
