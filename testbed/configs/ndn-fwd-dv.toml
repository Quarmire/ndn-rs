# ndn-fwd (ndn-rs) configuration for the G.05 ndn-dv interop testbed.
#
# Companion to `testbed/docker-compose.yml` service `ndn-fwd-dv`
# (172.30.0.40). Peers with `ndnd-dv` (172.30.0.41) over UDP.

[engine]
cs_capacity_mb       = 16
pipeline_channel_cap = 1024

[cs]
variant     = "lru"
capacity_mb = 16

# UDP listener on the testbed network. ndnd-dv at 172.30.0.41 sends
# Adv Sync Interests here.
[[face]]
kind = "udp"
bind = "0.0.0.0:6363"

[management]
face_socket = "/run/ndn-fwd-dv/ndn-fwd-dv.sock"

[security]
auto_init = true
identity  = "/ndn/r-rs"
profile   = "accept_signed"

[routing.dv]
enabled         = true
network         = "/ndn"
router          = "/ndn/r-rs"
# Short intervals so the witness completes inside its 60 s budget.
adv_sync_secs   = 2
pfx_sync_secs   = 2
router_dead_secs = 30

[[routing.dv.neighbor]]
name     = "/ndn/r-ndnd"
face_uri = "udp4://172.30.0.41:6363"

[logging]
level = "info"
