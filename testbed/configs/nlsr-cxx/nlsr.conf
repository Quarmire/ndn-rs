; C++ NLSR config for G.04 interop witness.
;
; Topology: /test network, two-node link-state topology.
;   nlsr-cxx (this node):  /test/c-nlsr/%C1.Router/r1  — 172.30.0.13 / nfd-nlsr 172.30.0.14
;   ndn-fwd-nlsr (peer):   /test/r-nlsr/%C1.Router/r2  — 172.30.0.30
;
; Security: trust-anchor type any — accepts LSAs from any key.
; Permissive policy is appropriate for a two-node witness where
; identity provisioning is out of scope.

general
{
  network /test
  site /c-nlsr
  router /%C1.Router/r1

  lsa-refresh-time 1800
  lsa-interest-lifetime 4
  sync-protocol psync
  sync-interest-lifetime 60000

  state-dir /var/lib/nlsr
}

neighbors
{
  hello-retries 3
  hello-timeout 1
  ; C++ NLSR's conf-file-processor enforces validator ranges on these
  ; intervals.  The current `nlsr:latest` image accepts:
  ;     hello-interval          [30, 90]   (production default 60)
  ;     adj-lsa-build-interval  [5, 30]    (production default 10)
  ; Earlier image versions tolerated faster timers; the witness has been
  ; bumped to 180 s convergence budget to accommodate the slower minimums.
  hello-interval 30
  adj-lsa-build-interval 5
  face-dataset-fetch-tries 3
  face-dataset-fetch-interval 3600

  neighbor
  {
    ; ndn-fwd-nlsr's UDP socket (ndn-rs forwarder with NLSR enabled).
    name /test/r-nlsr/%C1.Router/r2
    face-uri udp4://172.30.0.30:6363
    link-cost 10
  }
}

hyperbolic
{
  state off
  radius 0.0
  angle  0.0
}

fib
{
  max-faces-per-prefix 3
  ; Reduced for two-node witness so convergence fits in 90 s.
  ; Production default: routing-calc-interval 15.
  routing-calc-interval 5
}

advertising
{
  /test/r1/data 0
}

security
{
  validator
  {
    rule
    {
      id "Accept All Data"
      for data
      filter
      {
        type name
        regex ^<>*$
      }
      checker
      {
        type customized
        sig-type ecdsa-sha256
        key-locator
        {
          type name
          regex ^<>*<KEY><>{1,3}$
        }
      }
    }

    trust-anchor
    {
      type any
    }
  }

  prefix-update-validator
  {
    rule
    {
      id "Accept All Commands"
      for interest
      filter
      {
        type name
        regex ^<>*$
      }
      checker
      {
        type customized
        sig-type ecdsa-sha256
        key-locator
        {
          type name
          regex ^<>*<KEY><>{1,3}$
        }
      }
    }

    trust-anchor
    {
      type any
    }
  }

  cert-to-publish "/var/lib/nlsr/router.cert"
}
