# ndn-fwd testbed configuration
# Used by the Docker Compose testbed for protocol compliance and benchmarking.

[engine]
pipeline_threads     = 2
cs_capacity_mb       = 64
pipeline_channel_cap = 4096

[cs]
variant     = "lru"
capacity_mb = 64

[security]
# No persistent identity in testbed; ephemeral key is auto-generated.
profile = "disabled"

# Management-command security: disable signing requirement in the testbed
# so existing unsigned-command compliance scripts continue to work.
# Production deployments should set require_signed_commands = true and
# provide trust_anchor_pib pointing to a populated PIB.
[security.mgmt]
require_signed_commands = false

[[face]]
kind = "udp"
bind = "0.0.0.0:6363"

[[face]]
kind = "tcp"
bind = "0.0.0.0:6364"

[management]
face_socket = "/run/ndn-fwd/ndn-fwd.sock"

[logging]
level = "info"
