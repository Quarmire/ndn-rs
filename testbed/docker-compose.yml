# NDN Forwarder Testbed
#
# Three-node topology for protocol compliance testing and benchmarking:
#
#   consumer ──── ndn-fwd ──┬── NFD    ──── producer
#                            └── yanfd  ────/
#
# ndn-iperf is used for throughput/latency benchmarks.
# NOTE: SHM face is only available between ndn-fwd and in-process tools;
#       NFD and yanfd use UDP faces in this testbed.
#
# Usage:
#   docker compose up -d
#   ./tests/compliance/run_all.sh
#   ./bench/run_all.sh

name: ndn-testbed

# Named volumes share each forwarder's Unix socket directory with testclient,
# so ndn-iperf / ndn-ping / ndn-ctl can connect via --face-socket without SHM.
volumes:
  ndn-fwd-sock:
  nfd-sock:
  yanfd-sock:
  ndnd-fw-dv-sock:    # shared between ndnd-fw-dv and ndnd-dv (dv daemon's app socket)
  nfd-nlsr-sock:      # shared between nfd-nlsr and nlsr-cxx (Unix socket handoff)
  nlsr-cxx-data:      # /var/lib/nlsr state for C++ NLSR
  ndn-fwd-nlsr-sock:  # management socket for the NLSR-enabled ndn-rs instance
  nfd-ndncert-sock:   # shared between nfd-ndncert, ndncert-ca, and interop (C.13 witness)
  dioxus-demo-sock:   # management socket for Phase 4 in-browser demo forwarder

networks:
  ndn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:

  # ── ndn-fwd (ndn-rs) ──────────────────────────────────────────────────────
  ndn-fwd:
    build:
      context: ..
      dockerfile: binaries/spec/ndn-fwd/Dockerfile
    container_name: ndn-fwd
    hostname: ndn-fwd
    networks:
      ndn-net:
        ipv4_address: 172.30.0.10
    ports:
      - "6363:6363/udp"
      - "6363:6363/tcp"
      - "6364:6364/tcp"   # management / WebSocket
    volumes:
      - ./configs/ndn-fwd.toml:/etc/ndn-fwd/config.toml:ro
      - ndn-fwd-sock:/run/ndn-fwd
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6364 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── NFD (named-data reference implementation) ─────────────────────────────
  nfd:
    image: ghcr.io/named-data/nfd:latest
    container_name: nfd
    hostname: nfd
    networks:
      ndn-net:
        ipv4_address: 172.30.0.11
    ports:
      - "6366:6363/udp"
      - "6366:6363/tcp"
    volumes:
      - ./configs/nfd.conf:/etc/ndn/nfd.conf:ro
      - nfd-sock:/run/nfd
    command: ["nfd", "--config", "/etc/ndn/nfd.conf"]
    healthcheck:
      test: ["CMD-SHELL", "nfdc status 2>/dev/null | grep -q 'uptime' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ── yanfd (ndnd Go forwarder) ─────────────────────────────────────────────
  yanfd:
    image: ghcr.io/named-data/ndnd:latest
    container_name: yanfd
    hostname: yanfd
    networks:
      ndn-net:
        ipv4_address: 172.30.0.12
    ports:
      - "6367:6363/udp"
      - "6367:6363/tcp"
    volumes:
      - ./configs/yanfd.yml:/etc/yanfd/config.yml:ro
      - yanfd-sock:/run/nfd
    # ndnd >= 0.7: binary is "ndnd", subcommand "fw run <config>"
    command: ["fw", "run", "/etc/yanfd/config.yml"]
    healthcheck:
      # ndnd image is FROM scratch — no shell or nc; use the binary itself.
      # "fw status" connects to the unix socket and exits 0 when the forwarder is up.
      test: ["CMD", "/ndnd", "fw", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ── Interop client (ndn-cxx + NDNts + ndn-rs tools) ─────────────────────
  # Used by live interop audit witnesses that need ndn-cxx ndnpeek/ndnpoke.
  interop:
    build:
      context: ..
      dockerfile: testbed/Dockerfile.interop
    container_name: interop
    hostname: interop
    networks:
      ndn-net:
        ipv4_address: 172.30.0.21
    depends_on:
      ndn-fwd:
        condition: service_healthy
      nfd:
        condition: service_healthy
    volumes:
      - ndn-fwd-sock:/run/ndn-fwd:ro
      - nfd-sock:/run/nfd:ro
      - nfd-ndncert-sock:/run/nfd-ndncert:ro
      - ./tests:/testbed/tests:ro
    command: ["sleep", "infinity"]

  # ── nfd-nlsr (NFD sidecar for C++ NLSR) ──────────────────────────────────────
  # C++ NLSR requires a co-located NFD it can reach via Unix socket.
  # This sidecar shares the nfd-nlsr-sock volume with nlsr-cxx so NLSR
  # can call nfdc/ndn-cxx without talking to the compliance-test NFD service.
  nfd-nlsr:
    image: ghcr.io/named-data/nfd:latest
    container_name: nfd-nlsr
    hostname: nfd-nlsr
    networks:
      ndn-net:
        ipv4_address: 172.30.0.14
    volumes:
      - ./configs/nfd-nlsr/nfd.conf:/etc/ndn/nfd.conf:ro
      - ./configs/nfd-nlsr/entrypoint.sh:/entrypoint.sh:ro
      - nfd-nlsr-sock:/run/nfd-nlsr
    # Override the image ENTRYPOINT so we can start nfd, wait for its
    # socket, and run the nfdc bootstrap that pre-registers the outbound
    # UDP face + route to ndn-fwd-nlsr before nlsr-cxx tries to peer.
    # The `nlsr:latest` image doesn't ship nfdc, so the bootstrap has
    # to live in the NFD container.  See configs/nfd-nlsr/entrypoint.sh.
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    command: []
    healthcheck:
      test: ["CMD-SHELL", "NDN_CLIENT_TRANSPORT=unix:///run/nfd-nlsr/nfd.sock nfdc status 2>/dev/null | grep -q 'uptime' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ── nlsr-cxx (C++ NLSR reference implementation) ──────────────────────────────
  # Uses the published ghcr.io/named-data/nlsr:latest runtime image.
  # Connects to nfd-nlsr via Unix socket (NDN_CLIENT_SOCK) and peers with
  # ndn-fwd-nlsr over UDP for the G.04 NLSR interop witness.
  nlsr-cxx:
    image: ghcr.io/named-data/nlsr:latest
    container_name: nlsr-cxx
    hostname: nlsr-cxx
    networks:
      ndn-net:
        ipv4_address: 172.30.0.13
    depends_on:
      nfd-nlsr:
        condition: service_healthy
      ndn-fwd-nlsr:
        condition: service_healthy
    volumes:
      - ./configs/nlsr-cxx/nlsr.conf:/etc/ndn/nlsr.conf:ro
      - ./configs/nlsr-cxx/entrypoint.sh:/entrypoint.sh:ro
      - nfd-nlsr-sock:/run/nfd-nlsr
      - nlsr-cxx-data:/var/lib/nlsr
    environment:
      NDN_CLIENT_TRANSPORT: "unix:///run/nfd-nlsr/nfd.sock"
    # Override the image ENTRYPOINT (not CMD) so the identity-gen script runs
    # before NLSR starts.  The image entrypoint is /usr/bin/nlsr; using
    # 'entrypoint:' replaces it entirely.
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    restart: unless-stopped

  # ── nfd-ndncert (NFD sidecar for C.13 ndncert-ca) ──────────────────────────────
  # ndncert-ca-server requires a co-located NFD to register prefixes and exchange
  # NDN packets.  Socket at /run/nfd-ndncert/nfd.sock to avoid colliding with the
  # compliance-test NFD at /run/nfd/nfd.sock.
  nfd-ndncert:
    image: ghcr.io/named-data/nfd:latest
    container_name: nfd-ndncert
    hostname: nfd-ndncert
    networks:
      ndn-net:
        ipv4_address: 172.30.0.15
    volumes:
      - ./configs/nfd-ndncert/nfd.conf:/etc/ndn/nfd.conf:ro
      - nfd-ndncert-sock:/run/nfd-ndncert
    command: ["nfd", "--config", "/etc/ndn/nfd.conf"]
    healthcheck:
      test: ["CMD-SHELL", "NDN_CLIENT_TRANSPORT=unix:///run/nfd-ndncert/nfd.sock nfdc status 2>/dev/null | grep -q 'uptime' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # ── ndncert-ca (upstream ndncert-ca-server, for C.13 live interop witness) ──────
  # Runs against nfd-ndncert.  CA prefix: /test/ndncert/CA.  Challenge: pin only
  # (simplest automation path — no SMTP infra required).
  # NDN_LOG=ndncert.challenge.pin=TRACE makes the generated PIN visible in
  # docker logs so the witness script can extract it without a human operator.
  ndncert-ca:
    build:
      context: ..
      dockerfile: testbed/Dockerfile.ndncert-ca
    container_name: ndncert-ca
    hostname: ndncert-ca
    networks:
      ndn-net:
        ipv4_address: 172.30.0.16
    depends_on:
      nfd-ndncert:
        condition: service_healthy
    volumes:
      - ./configs/ndncert-ca/ca.conf:/config/ndncert-ca.conf:ro
      - ./configs/ndncert-ca/entrypoint.sh:/config/entrypoint.sh:ro
      - nfd-ndncert-sock:/run/nfd
    environment:
      NDN_CLIENT_TRANSPORT: "unix:///run/nfd/nfd.sock"
      NDN_LOG: "ndncert.challenge.pin=TRACE"
    restart: unless-stopped

  # ── ndn-fwd-nlsr (ndn-rs with NLSR enabled, for G.04 interop witness) ─────────
  # Separate from the baseline ndn-fwd service so other compliance tests
  # are unaffected.  Uses configs/ndn-fwd-nlsr/ndn-fwd.toml which adds
  # [routing.nlsr] and a point-to-point UDP face to nfd-nlsr.
  ndn-fwd-nlsr:
    build:
      context: ..
      dockerfile: binaries/spec/ndn-fwd/Dockerfile
    container_name: ndn-fwd-nlsr
    environment:
      RUST_LOG: "info"
    hostname: ndn-fwd-nlsr
    networks:
      ndn-net:
        ipv4_address: 172.30.0.30
    volumes:
      - ./configs/ndn-fwd-nlsr/ndn-fwd.toml:/etc/ndn-fwd/config.toml:ro
      - ndn-fwd-nlsr-sock:/run/ndn-fwd
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6364 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── ndn-fwd-dv (ndn-rs with ndn-dv routing, for G.05 interop witness) ─────
  # Pairs with `ndnd-dv` over UDP to prove on-the-wire compatibility
  # with ndnd's `dv run` daemon. Uses configs/ndn-fwd-dv.toml which
  # enables `[routing.dv]` with a single static neighbour pointing
  # at 172.30.0.41 (ndnd-dv). Tight 2 s sync intervals so the witness
  # converges inside its budget.
  ndn-fwd-dv:
    profiles: ["dv-interop"]
    # Same binary as `ndn-fwd` / `ndn-fwd-nlsr` — only the mounted
    # config differs. Reuses the pre-built image to skip the cargo-chef
    # build chain (which can OOM on 8 GB-RAM Docker Desktop hosts).
    image: ndn-testbed-ndn-fwd:latest
    build:
      context: ..
      dockerfile: binaries/spec/ndn-fwd/Dockerfile
    container_name: ndn-fwd-dv
    environment:
      RUST_LOG: "info,routing.dv=debug,face.udp=info"
    hostname: ndn-fwd-dv
    networks:
      ndn-net:
        ipv4_address: 172.30.0.40
    volumes:
      - ./configs/ndn-fwd-dv.toml:/etc/ndn-fwd/config.toml:ro
    restart: "no"

  # ── ndnd-fw-dv (ndnd forwarder backing ndnd-dv) ──────────────────────────
  # `ndnd dv run` connects to a forwarder via a Unix socket; the
  # ndnd image is FROM scratch, so we run two ndnd processes in two
  # containers and share `/run/nfd/nfd.sock` via a named volume.
  # This forwarder listens on UDP 6363 for ndn-rs's Sync Interests.
  ndnd-fw-dv:
    profiles: ["dv-interop"]
    image: ghcr.io/named-data/ndnd:latest
    container_name: ndnd-fw-dv
    hostname: ndnd-fw-dv
    networks:
      ndn-net:
        ipv4_address: 172.30.0.41
    volumes:
      - ./configs/ndnd-fw-dv.yml:/etc/ndnd/fw.yml:ro
      - ndnd-fw-dv-sock:/run/nfd
    command: ["fw", "run", "/etc/ndnd/fw.yml"]
    healthcheck:
      test: ["CMD", "/ndnd", "fw", "status"]
      interval: 3s
      timeout: 2s
      retries: 8
      start_period: 3s
    restart: "no"

  # ── ndnd-dv (ndnd's distance-vector daemon, G.05 interop peer) ───────────
  # Runs `ndnd dv run` against an `insecure`-mode config that lists
  # ndn-fwd-dv (172.30.0.40) as its only neighbour. ndnd's DV daemon
  # speaks Adv Sync and Pfx Sync via /localhop, exactly the wire
  # contract `crates/spec/ndn-routing/src/protocols/dv/` implements.
  ndnd-dv:
    profiles: ["dv-interop"]
    image: ghcr.io/named-data/ndnd:latest
    container_name: ndnd-dv
    hostname: ndnd-dv
    depends_on:
      ndnd-fw-dv:
        condition: service_healthy
    networks:
      ndn-net: {}
    volumes:
      - ./configs/ndnd-dv.yml:/etc/ndnd/dv.yml:ro
      - ndnd-fw-dv-sock:/run/nfd
    command: ["dv", "run", "/etc/ndnd/dv.yml"]
    restart: "no"

  # ── Test runner (shared tools container) ──────────────────────────────────
  # Used by bench and compliance scripts as the "outside" node.
  # Has ndn-tools (ndn-iperf, ndn-ping, ndn-peek, ndn-put) installed.
  testclient:
    build:
      context: ..
      dockerfile: testbed/Dockerfile.testclient
    container_name: testclient
    hostname: testclient
    networks:
      ndn-net:
        ipv4_address: 172.30.0.20
    depends_on:
      ndn-fwd:
        condition: service_healthy
      nfd:
        condition: service_healthy
      yanfd:
        condition: service_healthy
    volumes:
      - ./results:/results
      - ndn-fwd-sock:/run/ndn-fwd:ro
      - nfd-sock:/run/nfd:ro
      - yanfd-sock:/run/yanfd:ro
    command: ["sleep", "infinity"]

  # ── dioxus-demo-fwd (Phase 4 in-browser demo) ───────────────────────────
  # Boots a WebTransport listener on :4433 plus UDP/TCP on :6363/:6364 so the
  # browser tab can dial in and a native ndn-tools peek can fetch from the
  # browser-served producer (the load-bearing producer-round-trip witness).
  dioxus-demo-fwd:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: binaries/spec/ndn-fwd/Dockerfile
    container_name: dioxus-demo-fwd
    hostname: dioxus-demo-fwd
    networks:
      ndn-net:
        ipv4_address: 172.30.0.30
    ports:
      - "4433:4433/udp"   # WebTransport (QUIC)
      - "6373:6363/udp"   # native ndn-tools peek
      - "6373:6363/tcp"
    volumes:
      - ./configs/dioxus-demo-fwd.toml:/etc/ndn-fwd/config.toml:ro
      - dioxus-demo-sock:/run/ndn-fwd
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6363 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
