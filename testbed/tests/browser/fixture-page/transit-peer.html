<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Phase 7 transit-peer fixture</title>
</head>
<body>
  <p>Phase 7 transit-peer fixture — drives `TransitPeer` from Playwright.</p>
  <pre id="log"></pre>
  <script src="/sw-pkg/shared_engine.js"></script>
  <script>
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += msg + '\n';
      console.log('[peer-tab]', msg);
    }
    (async () => {
      await wasm_bindgen('/sw-pkg/shared_engine_bg.wasm');
      const { TransitPeer } = wasm_bindgen;
      window.__peer = new TransitPeer();
      log('TransitPeer ready');
      window.__peerReady = true;
    })().catch((e) => {
      log('FATAL: ' + (e?.message ?? String(e)));
      window.__peerReadyError = String(e);
    });
  </script>
</body>
</html>
