<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Phase 6 SharedWorker tab fixture</title>
</head>
<body>
  <p>Phase 6 SharedWorker tab fixture — drives `SharedClient` from Playwright.</p>
  <pre id="log"></pre>
  <script src="/sw-pkg/shared_engine.js"></script>
  <script>
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += msg + '\n';
      console.log('[tab]', msg);
    }

    (async () => {
      await wasm_bindgen('/sw-pkg/shared_engine_bg.wasm');
      const { SharedClient } = wasm_bindgen;
      // The worker `name` is the SharedWorker identity per W3C — same
      // (url, name) pair from any tab joins the same worker. We use a
      // URL-encoded name carrying upstream + producers so the bootstrap
      // can set both from the test fixture without a separate config.
      const workerName = 'producers=%2Fcache-test';
      const client = new SharedClient('/shared-worker.js', workerName);
      log('SharedClient connected; worker name="' + workerName + '"');
      window.__sharedClient = client;
      window.__sharedReady = true;
      log('window.__sharedClient ready');
    })().catch((e) => {
      log('FATAL: ' + (e?.message ?? String(e)));
      window.__sharedReadyError = String(e);
    });
  </script>
</body>
</html>
