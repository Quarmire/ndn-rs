<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Critical-path #4 onboarding-join fixture</title>
</head>
<body>
  <p>Critical-path #4 onboarding-join fixture — drives `JoinClient` from Playwright.</p>
  <pre id="log"></pre>
  <script src="/sw-pkg/shared_engine.js"></script>
  <script>
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += msg + '\n';
      console.log('[join-tab]', msg);
    }
    (async () => {
      await wasm_bindgen('/sw-pkg/shared_engine_bg.wasm');
      const { JoinClient } = wasm_bindgen;
      window.__join = await JoinClient.open();
      log('JoinClient ready');
      window.__joinReady = true;
    })().catch((e) => {
      log('FATAL: ' + (e?.message ?? String(e)));
      window.__joinReadyError = String(e);
    });
  </script>
</body>
</html>
