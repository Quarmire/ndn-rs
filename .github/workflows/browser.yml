name: Browser — WebSocket interop (NDNts ↔ ndn-fwd)

# Tests NDNts WsTransport running inside a real Chromium browser connecting to
# the ndn-rs forwarder via WebSocket.  Two browser pages exchange NDN Interest
# and Data through ndn-fwd's WS face — no external NDN tools required.
#
# Trigger conditions:
#   - Manual dispatch
#   - Push / PR that touches the WS face, ndn-fwd binary, or browser test code
#   - Weekly cron (Monday 04:00 UTC) to catch NDNts upstream changes

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * 1"

  push:
    branches: [main]
    paths:
      - "crates/spec/ndn-faces/src/net/websocket.rs"
      - "crates/spec/ndn-mgmt/**"
      - "crates/tooling/ndn-dashboard/**"
      - "binaries/spec/ndn-fwd/**"
      - "testbed/tests/browser/**"
      - ".github/workflows/browser.yml"

  pull_request:
    branches: [main]
    paths:
      - "crates/spec/ndn-faces/src/net/websocket.rs"
      - "crates/spec/ndn-mgmt/**"
      - "crates/tooling/ndn-dashboard/**"
      - "binaries/spec/ndn-fwd/**"
      - "testbed/tests/browser/**"
      - ".github/workflows/browser.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  browser-ws:
    name: Browser WS interop (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Rust: build ndn-fwd ──────────────────────────────────────────────────

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ndn-fwd-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ndn-fwd-

      - name: Install system dependencies
        # cargo's feature-unification + GHA-cache restore can drag in workspace
        # crates that link bluer / libdbus-sys / tray-icon's dbus backend on
        # Linux even when only `--bin ndn-fwd` is requested.  Install the
        # full apt list so the build never fails on a missing system header.
        # Same list as ci.yml's Linux setup.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev

      - name: Build ndn-fwd (release)
        run: cargo build --release --bin ndn-fwd

      # ── SharedWorker / transit WASM bundle ───────────────────────────────────
      # Phase 6 (sharedworker_cache_hit) and Phase 7 (transit_browser_as_
      # forwarder) fixture pages load `/sw-pkg/shared_engine_bg.wasm` which is
      # built from `crates/tooling/dioxus-demo` with the `shared-engine`
      # feature.  The output is gitignored, so CI builds it from source.

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - name: Build shared_engine wasm bundle
        run: bash testbed/tests/browser/build-shared-engine.sh

      # `wsmgmt_wire.spec.ts` loads the dashboard's `WsMgmtClient`
      # exposed via wasm-bindgen under the `witness-export` feature.
      - name: Build ndn-dashboard mgmt-wire witness bundle
        run: bash testbed/tests/browser/build-dashboard-witness.sh

      # ── Node.js: install deps, bundle NDNts, install browsers ───────────────

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node.js dependencies
        working-directory: testbed/tests/browser
        run: npm install

      - name: Bundle NDNts for browser (esbuild)
        working-directory: testbed/tests/browser
        run: node build.mjs

      - name: Install Playwright + Chromium
        working-directory: testbed/tests/browser
        run: npx playwright install --with-deps chromium

      # ── Run tests ────────────────────────────────────────────────────────────

      - name: Run browser WebSocket interop tests
        working-directory: testbed/tests/browser
        run: npm test
        env:
          NDN_FWD_BIN: ${{ github.workspace }}/target/release/ndn-fwd
          CI: "true"

      # ── Artefacts ────────────────────────────────────────────────────────────

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: testbed/tests/browser/playwright-report/
          retention-days: 14
