name: Wiki

# Builds and deploys the GitHub Pages site:
#   /       → landing page
#   /wiki/  → mdBook (docs/wiki)
#   /api/   → cargo doc output with a generated crate index
#
# The API crate index is generated from `cargo metadata`, never hand-written —
# a crate rename/move shows up here automatically.

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      # ── API docs (cargo doc) ────────────────────────────────────────────
      # Library crates only; the five example packages are excluded. A doc
      # failure fails the deploy — the site never silently ships without API
      # docs (the CI `docs` job catches breakage pre-merge anyway).
      - name: Build API docs
        env:
          RUSTDOCFLAGS: -Dwarnings
        run: |
          cargo doc --workspace --no-deps \
            --exclude example-secure-fetch \
            --exclude example-strategy-custom \
            --exclude example-strategy-composed \
            --exclude example-context-enricher \
            --exclude example-tier0-rpc-latency

      - name: Generate API crate index from cargo metadata
        run: |
          cargo metadata --no-deps --format-version 1 | python3 - <<'PY' > target/doc/index.html
          import json, sys
          from collections import defaultdict

          meta = json.load(sys.stdin)
          GROUPS = {
              "crates/core": "Core",
              "crates/forwarding": "Forwarding",
              "crates/faces": "Faces",
              "crates/security": "Security",
              "crates/protocols": "Protocols",
              "crates/app": "App",
              "crates/platform": "Platform",
          }
          groups = defaultdict(list)
          for p in meta["packages"]:
              if p["name"].startswith("example-"):
                  continue
              rel = p["manifest_path"].split("/ndn-rs/", 1)[-1]
              for prefix, title in GROUPS.items():
                  if rel.startswith(prefix):
                      groups[title].append((p["name"], p.get("description") or ""))
                      break

          head = """<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>ndn-rs API Docs</title><style>
          :root { color-scheme: dark; }
          * { margin:0; padding:0; box-sizing:border-box; }
          body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                 background:#0d1117; color:#e6edf3; padding:2rem; max-width:900px; margin:0 auto; }
          h1 { color:#58a6ff; margin-bottom:0.4rem; }
          .subtitle { color:#8b949e; margin-bottom:2rem; font-size:0.9rem; }
          h2 { color:#8b949e; font-size:0.75rem; text-transform:uppercase;
               letter-spacing:0.08em; margin:1.5rem 0 0.5rem; }
          .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:0.6rem; }
          a.crate { display:block; background:#161b22; border:1px solid #30363d; border-radius:8px;
                    padding:0.75rem 1rem; text-decoration:none; color:#e6edf3; transition:border-color .15s; }
          a.crate:hover { border-color:#58a6ff; }
          a.crate .name { color:#58a6ff; font-family:monospace; font-size:0.9rem; }
          a.crate .desc { color:#8b949e; font-size:0.78rem; margin-top:0.25rem; }
          .back { color:#8b949e; font-size:0.82rem; margin-bottom:1.5rem; display:inline-block; }
          .back:hover { color:#58a6ff; }
          </style></head><body>
          <a class="back" href="../">&larr; ndn-rs home</a>
          <h1>ndn-rs API Documentation</h1>
          <p class="subtitle">Generated from <code>cargo metadata</code> + <code>cargo doc --workspace --no-deps</code></p>"""
          print(head)
          for title in GROUPS.values():
              if not groups[title]:
                  continue
              print(f"<h2>{title}</h2><div class=\"grid\">")
              for name, desc in sorted(groups[title]):
                  module = name.replace("-", "_")
                  print(f'<a class="crate" href="{module}/"><div class="name">{name}</div>'
                        f'<div class="desc">{desc}</div></a>')
              print("</div>")
          print("</body></html>")
          PY

      # ── Wiki (mdBook) ───────────────────────────────────────────────────
      - name: Install mdBook + linkcheck
        env:
          MDBOOK_VERSION: "0.5.2"
          LINKCHECK_VERSION: "0.7.7"
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C $HOME/.local/bin
          curl -sSL "https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v${LINKCHECK_VERSION}/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip" -o /tmp/lc.zip
          unzip -o /tmp/lc.zip -d $HOME/.local/bin
          chmod +x $HOME/.local/bin/mdbook-linkcheck
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Mermaid renders client-side via docs/wiki/mermaid-init.js — no
      # preprocessor, no mdbook version coupling.
      - name: Build wiki
        run: mdbook build docs/wiki

      # ── Assemble the site ───────────────────────────────────────────────
      - name: Assemble site
        run: |
          mkdir -p target/site
          cp -r target/wiki target/site/wiki
          cp -r target/doc target/site/api

          cat > target/site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>ndn-rs</title>
            <style>
              :root { color-scheme: dark; }
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                background: #0d1117; color: #e6edf3;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                min-height: 100vh; gap: 2rem; padding: 2rem;
              }
              h1 { font-size: 2rem; color: #58a6ff; }
              p { color: #8b949e; max-width: 480px; text-align: center; line-height: 1.6; }
              .cards { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
              .card {
                background: #161b22; border: 1px solid #30363d; border-radius: 10px;
                padding: 1.5rem 2rem; text-decoration: none; color: inherit;
                transition: border-color 0.15s, transform 0.1s;
                min-width: 200px; text-align: center;
              }
              .card:hover { border-color: #58a6ff; transform: translateY(-2px); }
              .card-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
              .card h2 { font-size: 1.05rem; color: #58a6ff; margin-bottom: 0.3rem; }
              .card p { font-size: 0.82rem; color: #8b949e; margin: 0; }
              footer { font-size: 0.78rem; color: #8b949e; }
              footer a { color: #58a6ff; text-decoration: none; }
            </style>
          </head>
          <body>
            <div>
              <h1>ndn-rs</h1>
              <p style="margin-top:0.5rem">Named Data Networking forwarder stack in Rust</p>
            </div>
            <div class="cards">
              <a class="card" href="wiki/">
                <div class="card-icon">📖</div>
                <h2>Wiki</h2>
                <p>Guides for users, and the contributor book for developers</p>
              </a>
              <a class="card" href="api/">
                <div class="card-icon">📚</div>
                <h2>API Docs</h2>
                <p>Rust crate documentation generated by cargo doc</p>
              </a>
              <a class="card" href="https://github.com/Quarmire/ndn-rs" target="_blank" rel="noopener">
                <div class="card-icon">⚙️</div>
                <h2>Source</h2>
                <p>Browse the repository on GitHub</p>
              </a>
            </div>
            <footer>
              <a href="https://github.com/Quarmire/ndn-rs">github.com/Quarmire/ndn-rs</a>
            </footer>
          </body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
