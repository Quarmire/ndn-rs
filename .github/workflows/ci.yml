name: CI — core

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "testbed/**"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "testbed/**"
      - "Cargo.toml"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  dep-direction:
    name: Dep-direction guard (spec set is closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pure manifest parsing — fails fast if a spec crate gains an edge into a
      # non-spec crate. The cross-repo boundary is now structural, but this still
      # guards the core library's internal closure.
      - name: Run dep-direction guard
        run: python3 testbed/dep-direction-guard.py

  core:
    name: Core (fmt / clippy / test / doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-core-

      # ndn-rs is a pure-Rust library (no dashboard/webkit, SQLite is bundled),
      # so no system packages are required.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Doc build
        run: cargo doc --workspace --no-deps

  wasm32:
    name: WASM — wasm32-unknown-unknown check (core crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm32-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm32-
      - name: Check core crates for wasm32-unknown-unknown
        run: |
          cargo check -p ndn-foundation-types --target wasm32-unknown-unknown
          cargo check -p ndn-tlv             --target wasm32-unknown-unknown
          cargo check -p ndn-packet          --target wasm32-unknown-unknown --no-default-features --features std-wasm
          cargo check -p ndn-transport       --target wasm32-unknown-unknown
          cargo check -p ndn-store           --target wasm32-unknown-unknown
          cargo check -p ndn-strategy        --target wasm32-unknown-unknown
          cargo check -p ndn-runtime         --target wasm32-unknown-unknown

  riscv32imc:
    name: Embedded — riscv32imc no_std core chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-riscv32imc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-riscv32imc-
      - name: Build no_std core crates for riscv32imc-unknown-none-elf
        # The no-CAS no_std foundation chain (foundation-types/tlv/packet). The
        # full embedded build (ndn-embedded) lives in the ndn-embedded repo.
        env:
          RUSTFLAGS: --cfg=portable_atomic_unsafe_assume_single_core
        run: |
          cargo build --target riscv32imc-unknown-none-elf \
            --no-default-features --features portable-atomic \
            -p ndn-foundation-types -p ndn-tlv -p ndn-packet
