name: CI

# PR gate: every job here is required, parallel, and cache-backed. The deep,
# slow work (coverage, feature matrix, macOS, benches, fuzz) lives in
# nightly.yml — this lane exists to give a correct signal in minutes.
#
# Toolchain: rust-toolchain.toml pins the version, components, and cross
# targets; rustup auto-installs it on first cargo invocation, so jobs need no
# explicit toolchain action (the MSRV job overrides deliberately).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref; superseded PR pushes are cancelled. main never cancels —
# its runs populate the shared build caches PRs restore from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Escalate warnings — including the [workspace.lints] table — to errors at
  # the gate. Registry deps are unaffected (cargo caps lints off-path).
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets

  test:
    name: tests (nextest + doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: nextest (unit + integration)
        run: cargo nextest run --workspace
      - name: doctests (nextest does not run these)
        run: cargo test --workspace --doc

  docs:
    name: rustdoc (broken links are errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    env:
      # MSRV verifies "compiles on the oldest supported compiler", not "is
      # warning-free there" — older rustc emits warnings newer ones don't.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on rust-version
        run: |
          MSRV=$(cargo metadata --no-deps --format-version 1 |
                 python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['rust_version'])")
          echo "MSRV from Cargo.toml: $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          cargo "+$MSRV" check --workspace

  wasm32:
    name: wasm32-unknown-unknown (peer-target crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm32
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The verified wasm surface: the full forwarding chain up to and
      # including the engine. ndn-sync / ndn-security / ndn-app reach wasm
      # through sibling-repo feature paths and are not (yet) gated here.
      - name: check wasm peer-target crates
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p ndn-foundation-types -p ndn-tlv -p ndn-transport -p ndn-store \
            -p ndn-strategy -p ndn-runtime -p ndn-mgmt-wire -p ndn-fwd-core \
            -p ndn-signals-core -p ndn-discovery-core -p ndn-engine
          cargo check --target wasm32-unknown-unknown \
            -p ndn-packet --no-default-features --features std-wasm

  no_std:
    name: riscv32imc (bare-metal no_std chain)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Dwarnings --cfg=portable_atomic_unsafe_assume_single_core"
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: no_std
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build the no_std seed chain
        run: |
          cargo build --target riscv32imc-unknown-none-elf \
            --no-default-features --features portable-atomic \
            -p ndn-foundation-types -p ndn-tlv -p ndn-packet
          cargo build --target riscv32imc-unknown-none-elf \
            --no-default-features -p ndn-signals-core -p ndn-fwd-core

  deny:
    name: cargo-deny (advisories + licenses + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  dep-direction:
    name: dep-direction guard (spec set is closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 testbed/dep-direction-guard.py
