# cargo-deny configuration — supply-chain gate for ndn-rs.
# Run: cargo deny check        (advisories + licenses + bans + sources)
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Each ignore is a reviewed decision (audit P-4), not a blanket suppression.
ignore = [
  # rsa "Marvin Attack" — a timing side-channel in RSA *decryption*. ndn-rs uses
  # the `rsa` crate only for signature signing/verification; there is no RSA
  # decryption oracle anywhere in the codebase, so the attack surface is not
  # reachable. No fixed upstream version exists yet — re-evaluate when one ships.
  "RUSTSEC-2023-0071",
  # bincode 1.x unmaintained. Pulled only transitively by `rabe` under the
  # optional, off-by-default `abe` feature — absent from a default build. Track a
  # migration if ABE is promoted out of the experimental tier.
  "RUSTSEC-2025-0141",
  # lru `IterMut` unsoundness (Stacked Borrows). ndn-store's LruCs uses only
  # new/get/put/pop and never calls `LruCache::iter_mut`, so the unsound code
  # path is not exercised. Re-evaluate on the next `lru` release.
  "RUSTSEC-2026-0002",
  # `Error::downcast_mut` unsoundness in a transitive dep (audit follow-up); no
  # exploitation path exercised in-tree. Revisit when the upstream fix lands.
  "RUSTSEC-2026-0190",
]

[licenses]
# Skip the workspace's own unpublished crates (the `example-*` helpers are
# `publish = false` with no license field).
private = { ignore = true }
# Permissive set consistent with the workspace's own MIT OR Apache-2.0.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are a warning, not a hard failure (the rustcrypto 0.13/0.10
# split is a known, documented tradeoff in the workspace Cargo.toml).
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
