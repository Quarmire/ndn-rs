[package]
name = "ndn-pib-idb"
description = "IndexedDB-backed PIB for browser-tier ndn-rs (key seeds, issued certs, trust anchors)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[lib]
crate-type = ["rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
ndn-packet  = { workspace = true, features = ["std-wasm"] }
ndn-safebag = { workspace = true }
# `default-features = false` skips `sqlite-pib` (libsqlite3-sys); the
# wasm validator path needs `Certificate` + `Validator` + `TrustSchema`,
# which are pure-Rust.
ndn-security = { path = "../ndn-security", default-features = false }
bytes       = { workspace = true, features = ["std"] }
thiserror   = { workspace = true }
tracing     = { workspace = true }

wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbObjectStoreParameters",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbRequestReadyState",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Window",
    "WorkerGlobalScope",
    "DomException",
    "Event",
] }

# Native build is a no-op shell so the crate stays in default-members
# without forcing the full wasm dep set on host toolchains.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-packet  = { workspace = true, features = ["std"] }
ndn-safebag = { workspace = true }
ndn-security = { path = "../ndn-security", default-features = false }
bytes       = { workspace = true, features = ["std"] }
thiserror   = { workspace = true }
