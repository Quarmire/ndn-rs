[package]
name = "ndn-identity"
description = "NDN identity management: NdnIdentity lifecycle, NDNCERT enrollment, fleet zero-touch provisioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-packet   = { workspace = true, features = ["std"] }
ndn-security = { workspace = true, features = ["custodian"] }
ndn-tlv      = { workspace = true }
ndn-cert     = { workspace = true }
ndn-app      = { workspace = true }
ndn-sync     = { workspace = true }
bytes        = { workspace = true, features = ["std"] }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
base64       = { workspace = true }
futures      = { workspace = true }
tokio        = { workspace = true, features = ["sync", "time", "rt"] }
tokio-util   = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }
sha2         = { workspace = true }
dashmap      = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
ndn-engine    = { workspace = true }
ndn-face     = { workspace = true }
ndn-transport = { workspace = true }

[lints]
workspace = true
