[package]
name = "ndn-cert"
description = "NDNCERT: NDN certificate management protocol — issuance, challenges, and CA logic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[features]
default = ["yubikey-challenge"]
# YubiKey HOTP challenge handler. Pulls `ring::hmac` which fails to
# compile for `wasm32-unknown-unknown`; disable for browser builds.
yubikey-challenge = ["dep:ring"]
# Browser/wasm enrollment client — minimal surface, no native challenges.
wasm-client = []
# A namespace root kept in the platform keychain (`root_store`, kind
# `os-keyring`): Secret Service on Linux/BSD, Keychain on macOS, Credential
# Manager on Windows. libdbus is built from source (`vendored`), so no
# system dbus development files are needed.
os-keyring = ["dep:keyring"]
# A namespace root generated on a YubiKey PIV slot (`root_store`, kind
# `yubikey-piv`). Needs pcscd at run time.
yubikey-piv = ["ndn-security/yubikey-piv"]

[dependencies]
ndn-tlv      = { workspace = true, features = ["std"] }
ndn-packet   = { workspace = true, features = ["std"] }
ndn-security = { workspace = true }
ndn-trust-envelope = { workspace = true }
bytes        = { workspace = true, features = ["std"] }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
dashmap      = { workspace = true }
parking_lot  = { workspace = true }
ring         = { workspace = true, optional = true }
getrandom    = { workspace = true }
futures      = { workspace = true }
tokio        = { workspace = true, features = ["sync", "time"] }
base64       = { workspace = true }
tracing      = { workspace = true }
web-time     = { workspace = true }
# NDNCERT 0.3 Phase 1C: ECDH + HKDF + AES-GCM
p256         = { workspace = true }
aes-gcm      = { workspace = true }
hkdf         = { workspace = true }
sha2         = { workspace = true }
# Root store (`root_store`): the descriptor `<pib>/root/store.toml`, and
# zeroing the passphrases / PINs that unlock it.
toml         = "0.8"
zeroize      = "1"
keyring      = { version = "3.6", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
# Recovery kits (`recovery`): a recovery key's 32-byte seed shown as 24
# BIP39 English words, whose checksum catches a mistyped word; `zeroize`
# wipes the `Mnemonic` (which encodes the whole seed) when it is dropped.
bip39        = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
# A file kit's passphrase is sealed in Unicode NFC, so the same text typed
# through an input method that produces NFD still opens it.
unicode-normalization = "0.1"

# Root store: reading a passphrase / PIN from the terminal without echo.
[target.'cfg(unix)'.dependencies]
libc         = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
