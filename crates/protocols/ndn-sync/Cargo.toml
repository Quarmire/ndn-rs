[package]
name = "ndn-sync"
description = "NDN dataset synchronisation protocols: SVS, PSync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[features]
default = []
# Persistent SVS `DataStore` (`BackendStore`) over `ndn-storage`'s synchronous
# `SyncBackend` core. fjall/redb are synchronous underneath (the async
# `Backend` is a spawn_blocking wrapper we don't need), so this bridges without
# changing the `DataStore` trait — no downstream `impl DataStore` breaks. Off by
# default so the base crate stays dependency-light and wasm-safe; the in-memory
# `SyncMemoryBackend` needs no extra deps, `store-fjall` / `store-redb` add the
# on-disk engines (native only).
persistent-store = ["dep:ndn-storage"]
store-fjall = ["persistent-store", "ndn-storage/fjall"]
store-redb = ["persistent-store", "ndn-storage/redb"]

# Protocol logic is target-agnostic; only the driver loops' spawn/timer differ
# (see src/rt.rs). The crate builds for wasm32 so SVS/PSync run in the browser.
[dependencies]
ndn-tlv    = { workspace = true, features = ["std"] }
bytes         = { workspace = true, features = ["std"] }
tokio-util = { workspace = true }
thiserror  = { workspace = true }
fastrand   = "2"
# zlib compression for PSync IBLT wire encoding (PSync/detail/util.cpp CompressionScheme::ZLIB).
# Default `miniz_oxide` backend is pure-Rust → wasm-safe.
flate2     = "1"
# HMAC-SHA256 group-key signing/validation for Sync Interests
# (ndn-svs SIGNER_TYPE_HMAC). Both are pure-Rust → wasm-safe.
sha2       = { workspace = true }
hmac       = "0.13"
tracing    = { workspace = true }
# Instant/SystemTime that work on both targets (std::time::*::now() panics on wasm32).
web-time   = { workspace = true }
# Persistent `DataStore` backend (feature `persistent-store`). Only the sync
# core + name→wire key mapping are pulled here; on-disk engines ride the
# `store-fjall` / `store-redb` passthrough features.
ndn-storage = { workspace = true, features = ["sync", "named"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-packet = { workspace = true, features = ["std"] }
tokio      = { workspace = true, features = ["sync", "time", "rt", "macros"] }

# wasm32: tokio without `time` (its timer wheel panics in the browser); the
# driver loops use gloo-timers + spawn_local via src/rt.rs instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
ndn-packet           = { workspace = true, features = ["std-wasm"] }
tokio                = { workspace = true, features = ["sync", "rt", "macros"] }
gloo-timers          = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
proptest = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
