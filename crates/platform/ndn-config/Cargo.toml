[package]
name = "ndn-config"
description = "NDN forwarder TOML configuration and management interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[features]
# Provides `impl MgmtConfig for ForwarderConfig` so the forwarder can hand its
# config to ndn-mgmt`s command handlers. Off by default: lean consumers that
# only parse the TOML (e.g. mobile identity-only) do not pull the management
# stack. The crates that mount management enable it.
mgmt = ["dep:ndn-mgmt"]
# `boot`: apply a `ForwarderConfig` to a live engine (`EngineConfig`, Data-path
# validation + CS admission, `[[route]]` into the RIB, `[[strategy]]` into the
# strategy table). The one implementation shared by the forwarder binary and
# the simulator, so a simulated node boots exactly like a deployed one. Adds no
# crates beyond what `mgmt` pulls (via ndn-mgmt: ndn-engine, ndn-security,
# ndn-store).
boot = ["dep:ndn-mgmt", "dep:ndn-engine", "dep:ndn-security", "dep:ndn-store"]

[dependencies]
portable-atomic = { workspace = true }
ndn-mgmt-wire = { workspace = true }
ndn-mgmt      = { workspace = true, optional = true }
ndn-engine    = { workspace = true, optional = true }
# Path dep so `default-features = false` sticks (as in ndn-mgmt): boot needs
# only `SecurityProfile` / `SchemaRule`, not the sqlite PIB.
ndn-security  = { path = "../../security/ndn-security", default-features = false, optional = true }
ndn-store     = { workspace = true, optional = true }
ndn-tlv       = { workspace = true, features = ["std"] }
ndn-packet    = { workspace = true, features = ["std"] }
tracing       = { workspace = true }
ndn-transport = { workspace = true, features = ["serde"] }
bytes         = { workspace = true, features = ["std"] }
thiserror     = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
toml          = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
