[package]
name = "ndn-observability"
description = "NDN-native span publisher — encodes OTLP Span protobuf and serves it under a configurable NDN prefix"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[dependencies]
dashmap       = { workspace = true }
ndn-engine    = { workspace = true }
ndn-face-local = { workspace = true }
ndn-packet    = { workspace = true, features = ["std"] }
ndn-transport = { workspace = true }

bytes         = { workspace = true, features = ["std"] }
tokio         = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tokio-util    = { workspace = true, features = ["rt"] }
tracing       = { workspace = true }
parking_lot   = { workspace = true }
web-time      = { workspace = true }

# Bridge to the in-process `tracing` subscriber stack.  Optional so a
# host that publishes spans synthesised elsewhere can use the crate
# without pulling tracing-opentelemetry.
tracing-subscriber = { workspace = true, optional = true }

[features]
default = ["layer"]
# Build the tracing::Subscriber Layer that hands completed spans to a
# `SpanPublisher`. Disable to use the crate's encoder + publisher as
# library-of-bytes without tying into the global subscriber stack.
layer = ["dep:tracing-subscriber"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
ndn-engine = { workspace = true }
ndn-face-local = { workspace = true }
ndn-packet = { workspace = true, features = ["std"] }
ndn-transport = { workspace = true }
bytes = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["rt"] }
