[package]
name = "ndn-custodian"
version = "0.1.0"
edition = "2024"

[package.metadata.scope]
# Identity stack: the wasm-safe key-custody trait/KeyId, depended on by
# ndn-identity (spec). Part of the pure-library set.
classification = "spec"

[dependencies]
# Declared by path (not inherited) so we can set default-features = false:
# that drops ndn-security's `sqlite-pib` (rusqlite / C libsqlite3), keeping this
# crate — and everything that depends on it, including the wasm dashboard — free
# of the native PIB store.
ndn-security = { path = "../ndn-security", default-features = false }
ndn-packet   = { workspace = true, features = ["std"] }
ndn-tlv      = { workspace = true }
bytes        = { workspace = true, features = ["std"] }
async-trait  = { workspace = true }
dashmap      = { workspace = true }
thiserror    = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
