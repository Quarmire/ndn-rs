[package]
name = "ndn-crypto-core"
description = "Shared no_std NDN security core: Ed25519/SHA-256 over the signed region + signed-Data wire ops, used byte-identically by the native engine and the embedded forwarder"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[features]
# no_std, no-alloc. Never gains std.
default = []

[dependencies]
ndn-tlv       = { workspace = true }
ed25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
ndn-packet    = { workspace = true, features = ["std"] }
bytes         = { workspace = true, features = ["std"] }
ed25519-dalek = { version = "2" }
