[package]
name = "ndn-discovery-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Wasm-safe trait shapes for ndn-discovery (DiscoveryProtocol, NeighborTable, scope helpers)"

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-packet    = { workspace = true, default-features = false }
ndn-transport = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
tracing       = { workspace = true }
# std::time::Instant re-export on native; JS-clock-backed shim on wasm32.
# This crate is the wasm-safe trait surface, so its clock type must be too.
web-time      = { workspace = true }

# `std` and `std-wasm` are mutually exclusive opt-ins for ndn-packet's
# crypto path; ring (under `std`) does not build for wasm32-unknown-unknown.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-packet    = { workspace = true, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ndn-packet    = { workspace = true, features = ["std-wasm"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
