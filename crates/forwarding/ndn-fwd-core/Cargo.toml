[package]
name = "ndn-fwd-core"
description = "Canonical, runtime-agnostic NDN forwarding rules (sans-IO seed shared by the native engine and the embedded forwarder)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[features]
# This crate is `#![no_std]` and never gains a `std` feature. `alloc` is opt-in
# for the (future) table-owning helpers; the rule predicates need neither.
default = []
alloc = []

[dependencies]
ndn-signals-core = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
