[package]
name = "ndn-mgmt"
description = "NFD-compatible NDN management dispatcher (modules: rib, faces, fib, cs, strategy-choice, status, neighbors, service, security, routing, discovery, log)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# P1 compile-cost: tests/*.rs are modules of the single `suite` test binary
# (see [[test]] below), not thirteen auto-discovered binaries to link.
autotests = false

[package.metadata.scope]
classification = "spec"

[features]
# Forwarded by binaries. Off by default — the library compiles standalone.
yubikey-piv = ["ndn-security/yubikey-piv", "ndn-cert/yubikey-challenge"]
# Enables the ether:// faces/create arm (unicast NDN-over-Ethernet).
l2          = ["ndn-face/l2"]
# Enables ble:// (central) and ble-peripheral:// (server) faces/create arms.
# Enables the wts:// faces/create arm (outbound WebTransport dial).

[dependencies]
# Portable deps — build on every target including wasm32-unknown-unknown.
ndn-engine       = { workspace = true }
ndn-face-local   = { workspace = true }
# `ndn-face` is pulled only for native-only face transports (UDP/TCP/SHM
# creation, IPC listeners); see the target-cfg section below.

ndn-strategy     = { workspace = true }
# `default-features = false` skips ndn-security's `sqlite-pib` (libsqlite3-sys
# does not build on wasm). Native consumers of ndn-mgmt re-enable defaults
# via their own dep declaration; cargo unifies the feature set so FilePib
# etc. remain available on native builds.
# Inline path deps (not workspace inherited) so we can pass
# `default-features = false` — workspace inheritance can only ADD
# features, not override defaults. The native consumers of ndn-mgmt
# still pull the full feature set via their own workspace deps; cargo
# unifies, so FilePib + sqlite-pib + yubikey-challenge remain available
# on native builds.
ndn-security     = { path = "../../security/ndn-security", default-features = false }
ndn-cert         = { path = "../../security/ndn-cert",     default-features = false }
ndn-mgmt-wire    = { workspace = true }
ndn-packet       = { workspace = true, features = ["std"] }
ndn-tlv          = { workspace = true }
ndn-transport    = { workspace = true }

bytes            = { workspace = true, features = ["std"] }
# `web_time::Instant` is wire-compatible with `std::time::Instant` on
# native and uses `performance.now()` on wasm32; the engine's RibRoute
# uses it so we must match.
web-time         = { workspace = true }
base64           = { workspace = true }
# `net` and `io-util` are native-only; the wasm32 target excludes them
# below.  `rt + macros + time + sync` is enough for `tokio::select!`,
# `tokio::time::timeout`, and `tokio::spawn` on wasm.
tokio            = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tokio-util       = { workspace = true, features = ["rt"] }
tracing          = { workspace = true }
async-trait      = { workspace = true }
getrandom        = { workspace = true }
serde            = { workspace = true, features = ["derive"] }
serde_json       = { workspace = true }

# Native-only deps. ndn-discovery-core pulls tokio's `net` feature (mio), which
# does not build on wasm32. (Routing/discovery management modules have moved to
# their own crates and register via `MgmtHandles::extra_modules`, so mgmt no
# longer depends on ndn-routing/ndn-discovery — only on the shared core types.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-discovery-core = { workspace = true }
ndn-face        = { workspace = true }
# Optional: the wts:// faces/create dialer (pulls the QUIC stack).
# ndn-app powers the status_bridge.rs Producer mount (ARCH-6 / S11).
ndn-app          = { workspace = true }
tokio            = { workspace = true, features = ["net", "io-util"] }
libc             = { workspace = true }

[dev-dependencies]
tempfile         = "3"
# ndn-config is a dev-only dep now: ndn-mgmt`s handlers read it through the
# `MgmtConfig` trait, and ndn-config (extension) implements that downstream.
# Tests construct a real `ForwarderConfig`, so they enable its `mgmt` impl.
ndn-config       = { workspace = true, features = ["mgmt"] }
ndn-store        = { workspace = true }
# IPC-seam witness (tests/ipc_seam.rs): a client rides a socketpair fd.
ndn-ipc          = { workspace = true }

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
