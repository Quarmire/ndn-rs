[package]
name = "ndn-pathcontrol"
description = "PathControl: a signed, sequence-numbered, loop-safe control Interest that walks a path mutating per-hop forwarding/session state. The shared primitive under MAP-Me producer mobility (redirect) and pipe lifecycle (teardown/refresh) — G3."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
# spec: ndn-engine (spec) depends on this, and its own deps are all spec
# (ndn-foundation-types, ndn-packet, ndn-security), so the library closure holds.
classification = "spec"

[features]
default = []
# The signed-emitter side (producer mobility / pipe endpoint): build signed
# PathControl Interests. Pulls ndn-packet + ndn-security; the parse/forward side
# stays crypto-agnostic without it.
sign = ["dep:ndn-packet", "dep:ndn-security"]

[dependencies]
ndn-foundation-types = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
dashmap = { workspace = true }
ndn-packet = { workspace = true, optional = true, features = ["std"] }
ndn-security = { workspace = true, optional = true }

[dev-dependencies]
ndn-security = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
