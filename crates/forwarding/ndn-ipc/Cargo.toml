[package]
name = "ndn-ipc"
description = "NDN IPC layer: IpcClient, IpcServer, ServiceRegistry, ChunkedTransfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-packet     = { workspace = true, features = ["std"] }
ndn-mgmt-wire  = { workspace = true }
ndn-tlv        = { workspace = true, features = ["std"] }
ndn-transport  = { workspace = true }
ndn-face      = { workspace = true }
ndn-security   = { workspace = true }
async-trait    = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
tokio          = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util     = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
sha2           = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
