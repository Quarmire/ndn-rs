[package]
name = "ndn-ipc"
description = "NDN IPC layer: IpcClient, IpcServer, ServiceRegistry, ChunkedTransfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-packet     = { workspace = true, features = ["std"] }
ndn-mgmt-wire  = { workspace = true }
ndn-tlv        = { workspace = true, features = ["std"] }
ndn-transport  = { workspace = true }
ndn-face      = { workspace = true }
# Only the signing/verification surface is used — never the SQLite PIB — so
# drop `sqlite-pib` (direct path: Cargo forbids overriding a workspace dep's
# default-features). Keeps libsqlite3-sys out of sqlite-free consumers
# (ndn-rs-prelude); native apps that want the SQLite PIB get it via
# ndn-app's default `sqlite-pib` feature.
ndn-security   = { path = "../../security/ndn-security", default-features = false }
async-trait    = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
tokio          = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util     = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
sha2           = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
