[package]
name = "ndn-strategy"
description = "Built-in NDN forwarding strategies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-runtime   = { workspace = true }
ndn-store     = { workspace = true }
ndn-transport = { workspace = true }
ndn-signals-core = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
linkme        = { workspace = true }
smallvec      = { workspace = true }
tokio-util    = { workspace = true }
# `std::time::SystemTime` panics on wasm32; web-time shims it.
web-time      = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-packet = { workspace = true, features = ["std"] }
dashmap    = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ndn-packet = { workspace = true, features = ["std-wasm"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
