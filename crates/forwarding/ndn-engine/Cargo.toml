[package]
name = "ndn-engine"
description = "NDN forwarding engine: ForwarderEngine, EngineBuilder, pipeline, and task topology"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[features]
default = ["face-net"]
# Enables NDNLPv2 reliability + auto-MTU on UDP faces. Pulls only on
# `ndn-transport`'s reliability state machine — no native-only deps.
face-net = []
# Instrument-tier surface (Phase 3 §3.4) — opts researchers into the
# direct-table-access API (`ForwarderEngine::fib()`, `pit()`, …),
# `ContextEnricher`, `observability::targets`, and the `TapFace` wire-
# trace face. Items remain `pub` so in-tree code keeps compiling; this
# feature only controls whether they appear in `cargo doc`.
# Stability:   the *shape* of the surface follows SemVer; individual
#              items may move between patch releases. See
#              
experimental-instrument = []
# Partitioned forwarding data-plane runtime (native-only). Selects a
# decode-in-RX + per-worker forwarding model via `EngineConfig::data_plane`,
# the path toward NDN-DPDK-style per-core state partitioning. Phase 1 is a
# single-worker seam with no semantic change vs the shared runtime. Design:
# `.claude/notes/partitioned-fwd-design-2026-05-24.md`.
partitioned-fwd = []

[dependencies]
ndn-packet    = { workspace = true, default-features = false }
ndn-transport = { workspace = true }
ndn-discovery-core = { workspace = true }
ndn-store     = { workspace = true }
ndn-strategy  = { workspace = true }
ndn-signals-core = { workspace = true }  # the SignalSource trait only (concrete sources are downstream)
ndn-pathcontrol = { workspace = true }   # G3 PathControl primitive (forwarder hook)
async-trait   = { workspace = true }     # object-safe PathAuthorizer
ndn-runtime   = { workspace = true }
web-time      = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
smallvec      = { workspace = true }
dashmap       = { workspace = true }
arc-swap      = { workspace = true }
tokio-util    = { workspace = true, features = ["rt"] }
tracing       = { workspace = true }
thiserror     = { workspace = true }
anyhow        = { workspace = true }
# `ndn-security` is now portable: `default-features = false` skips the
# `sqlite-pib` feature (libsqlite3-sys doesn't build on wasm), so the
# pure-Rust signing + verification surface (`Validator`, `SecurityManager`,
# `Signer`) builds for `wasm32-unknown-unknown`.  Native consumers re-
# enable the default feature set via their own dep graphs; cargo unifies.
ndn-security  = { path = "../../security/ndn-security", default-features = false }

# Tokio's `rt-multi-thread` feature is unavailable on wasm32; the
# engine uses the runtime-abstraction shim (ndn-runtime) on wasm and only
# pulls the multi-thread executor on native.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-packet    = { workspace = true, features = ["std"] }
tokio         = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ndn-packet    = { workspace = true, features = ["std-wasm"] }
# `tokio/time` requires `std::time::Instant`, which panics on
# wasm32-unknown-unknown ("time not implemented on this platform").
# The wasm engine uses `ndn_runtime::Runtime::sleep` (gloo-timers)
# instead — `tokio::time::sleep`/`timeout` are dead code under the
# wasm cfg gates in this crate. Excluding the feature here prevents
# tokio from initializing its timer wheel at runtime.
tokio         = { workspace = true, features = ["sync", "macros", "rt"] }

[dev-dependencies]
# Captures the FIB shadow diagnostic in tests/fib_shadow_diagnostic.rs.
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
criterion     = { workspace = true }
ndn-strategy  = { workspace = true }
ndn-security  = { workspace = true }
ndn-tlv       = { workspace = true, features = ["std"] }
sha2          = { workspace = true }
# Cross-impl forwarding conformance: drive the shared decision vectors through
# a real engine with in-process faces.
ndn-face-local = { workspace = true }
ndn-fwd-core   = { workspace = true }
ndn-pathcontrol = { workspace = true }
# FaceFactory seam end-to-end: the reference UdpFaceFactory + a real UDP peer
# in tests/face_factory.rs. `net` gives the test tokio::net::UdpSocket.
ndn-face       = { workspace = true }
tokio          = { workspace = true, features = ["net", "macros", "rt-multi-thread", "time"] }

[[bench]]
name    = "pipeline"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
