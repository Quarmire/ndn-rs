[package]
name = "ndn-ble-framing"
description = "Shared BLE wire-framing codec for ndn-rs — NDNLPv2 and the NDNts/esp8266ndn 1-byte fragmentation header, with single- and per-sender reassembly"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
# Shared wire-framing codec depended on by ndn-face (spec), so it stays
# in the library set like ndn-signals-core — the BLE *faces* move out, the shared
# codec does not. (Latent cleanup: lift face-native's bluetooth module out too.)
classification = "spec"

[dependencies]
# wasm-compatible (no tokio, no native-only deps) so the Web Bluetooth crate
# can share it with the native faces.
ndn-packet = { workspace = true, features = ["std"] }
bytes      = { workspace = true, features = ["std"] }
