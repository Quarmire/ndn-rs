[package]
name = "ndn-safebag"
description = "NDN SafeBag (RFC-style key+cert bundle, PKCS#5-encrypted private key) — portable Ed25519 wire shape for browser PIBs and native tooling"
version.workspace = true
edition.workspace = true
license.workspace = true

# SafeBag wire format spec:
# https://github.com/named-data/ndn-cxx/blob/master/docs/specs/safe-bag.rst
#
# This crate is the wasm-buildable surface of what
# `ndn-security::safe_bag` already implements natively. The
# overlap is intentional and tracked for dedupe — the moment
# `ndn-security` itself builds for wasm32, this crate becomes
# the shared sub-crate both pull from.

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-tlv  = { workspace = true, default-features = false }
ndn-packet = { workspace = true, default-features = false }
bytes    = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
# Pure-Rust crypto for the encrypted-key path.
pkcs8         = { version = "0.10", default-features = false, features = ["std", "alloc", "encryption", "pem"] }
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
# OsRng on wasm needs getrandom's `js` feature; that flag lives
# in the workspace `getrandom` definition and is enabled by any
# downstream crate that opts into it (e.g. `dioxus-demo` /
# `ndn-pib-idb`'s `getrandom = { features = ["js"] }`).
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

[dev-dependencies]
# ECDSA-P256 keygen for the algorithm-detection roundtrip test.
# Workspace already pins p256 to 0.13 (the rustcrypto 0.13 release
# wave); pulling it in dev-only keeps the runtime dep surface
# Ed25519-only.
p256_ecdsa = { package = "p256", version = "0.13", default-features = false, features = ["std", "ecdsa", "pkcs8"] }
