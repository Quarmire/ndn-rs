[package]
name = "ndn-ipc"
description = "NDN IPC layer: IpcClient, IpcServer, ServiceRegistry, ChunkedTransfer"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[features]
default = ["spsc-shm"]
spsc-shm = ["ndn-face-native/spsc-shm"]

[dependencies]
ndn-packet     = { workspace = true, features = ["std"] }
ndn-config     = { workspace = true }
ndn-transport  = { workspace = true }
ndn-face-native      = { workspace = true }
ndn-security   = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
tokio          = { workspace = true, features = ["sync", "rt", "macros"] }
tokio-util     = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }

[dev-dependencies]
sha2           = { workspace = true }
