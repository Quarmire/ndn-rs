[package]
name = "ndn-app"
description = "NDN application API: Consumer, Producer, KeyChain, AppFace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# P1 compile-cost: tests/*.rs are modules of the single `suite` test binary
# (see [[test]] below), not eleven auto-discovered binaries to link.
autotests = false

[package.metadata.scope]
classification = "spec"

[features]
# `sqlite-pib` stays default-on so every existing native consumer keeps the
# ndn-cxx-compatible SQLite PIB without flag changes. It is a *named* feature
# (not implied by the raw dep) so sqlite-free consumers — ndn-rs-prelude in
# particular — can opt out with `default-features = false` and not have cargo
# feature-unification silently re-enable libsqlite3-sys behind their back.
default = ["sqlite-pib"]
sqlite-pib = ["ndn-security/sqlite-pib"]
blocking = ["tokio/rt"]
# Typed objects: `node.object(n).fetch_as::<T>()` and `serve_object_typed(n, &T)`
# (de)serialize Content as JSON via serde. Off by default — the byte API needs
# no serde.
serde = ["dep:serde", "dep:serde_json"]

# Wasm-safe core (both targets). The Consumer/Producer/EngineAppExt client
# surface builds for wasm32 so an in-browser embedded engine (WasmEngineBuilder)
# gets the same app API as native — see ndn-web-attach's in-page tier.
[dependencies]
ndn-tlv        = { workspace = true, features = ["std"] }
ndn-engine     = { workspace = true }
ndn-transport  = { workspace = true }
# The Runtime seam: rt::* routes through an injected runtime (virtual / discrete-event) when set.
ndn-runtime    = { workspace = true }
# ndn-sync (SVS/PSync) builds for wasm32 too, so the Subscriber pub/sub API is
# available in the browser.
ndn-sync       = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
tokio-util     = { workspace = true }
tracing        = { workspace = true }
thiserror      = { workspace = true }
async-trait    = { workspace = true }
# FLIC aggregated-signing manifest: per-segment SHA-256 leaves (wasm-safe).
sha2          = { workspace = true }
# Instant/SystemTime that work on both native (delegates to std) and wasm32
# (JS clocks) — std::time::{Instant,SystemTime}::now() panic on wasm32.
web-time       = { workspace = true }
# Optional (feature `serde`): typed object (de)serialization as JSON.
serde          = { workspace = true, optional = true }
serde_json     = { workspace = true, optional = true }

# Native-only: external-forwarder IPC (Unix socket), SVS sync, and the full
# tokio timer. The SQLite PIB (libsqlite3-sys — never wasm-buildable) rides on
# this crate's own `sqlite-pib` feature (default-on), not on the raw dep, so
# `default-features = false` consumers get a sqlite-free build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-packet     = { workspace = true, features = ["std"] }
# Direct path (not `workspace = true`) so `default-features = false` is allowed
# — Cargo forbids overriding a workspace dep's default-features. The default
# `sqlite-pib` is re-enabled through this crate's feature of the same name.
ndn-security   = { path = "../../security/ndn-security", default-features = false }
ndn-face = { workspace = true }
ndn-ipc        = { workspace = true }
tokio          = { workspace = true, features = ["sync", "rt", "time"] }

# Browser: in-process face from ndn-face-local (no OS sockets), security
# without the SQLite PIB, and gloo-timers/futures for the sleep + timeout the
# fetch path needs (tokio `time` panics on wasm32).
[target.'cfg(target_arch = "wasm32")'.dependencies]
ndn-packet     = { workspace = true, features = ["std-wasm"] }
# Direct path (not `workspace = true`) so `default-features = false` is allowed
# — Cargo forbids overriding a workspace dep's default-features. Drops the
# SQLite PIB (libsqlite3-sys), which can't build for wasm32. Mirrors ndn-engine.
ndn-security   = { path = "../../security/ndn-security", default-features = false }
ndn-face-local = { workspace = true }
tokio          = { workspace = true, features = ["sync"] }
futures        = { workspace = true }
gloo-timers    = { version = "0.3", features = ["futures"] }
# spawn_local for the Subscriber driver tasks (no ambient tokio runtime on wasm).
wasm-bindgen-futures = "0.4"

[dev-dependencies]
anyhow        = { workspace = true }
tokio         = { workspace = true, features = ["rt", "macros", "time"] }
# Multicast forwarding so SVS sync Interests fan out across in-process faces
# (the engine-backed Node publish/subscribe round-trip test).
ndn-strategy  = { workspace = true }
# BackendStore for the Publisher store-seam handoff test (N-15): the persistent
# DataStore the seam exists to admit. Test-only; the default build is unchanged.
ndn-sync      = { workspace = true, features = ["persistent-store"] }

[[test]]
name = "suite"
path = "tests/suite.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
