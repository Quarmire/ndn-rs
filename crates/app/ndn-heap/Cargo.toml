[package]
name = "ndn-heap"
description = "The data layer: one hash-chained log per (writer, space), membership as an operation fold, epoch keys, direct fetch of the entry a sync notice names, one newest-wins register, and durability by sequence reservation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-foundation-types = { workspace = true, features = ["std"] }
ndn-tlv      = { workspace = true, features = ["std"] }
ndn-app      = { workspace = true }
ndn-security = { workspace = true }
ndn-sync     = { workspace = true }
# The routing header of a channel frame (`ndn_transport::side_header`) is the
# first ten octets of the heap's frame header.
ndn-transport = { workspace = true }
bytes        = { workspace = true, features = ["std"] }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
parking_lot  = { workspace = true }
sha2         = { workspace = true }
hkdf         = { workspace = true }
# The checkpoint hash of a sent frame above 2,048 octets (channel.md).
blake3       = { workspace = true }
# Signal keys (spec §11) are zeroed when dropped.
zeroize      = "1"
# The seeded fast hash of the channel's per-message maps (names, ids): SipHash was a fifth of the
# sender's CPU per message (channel.md, Measured). No unsafe, no_std, builds for wasm32.
foldhash     = "0.1"
getrandom    = { workspace = true }
tracing      = { workspace = true }
web-time     = { workspace = true }
# Tasks end with a cancellation token (`Net`, `Group`).
tokio-util   = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-packet = { workspace = true, features = ["std"] }
# `rt`: the store's flush runs on the blocking pool (`spawn_blocking`).
tokio      = { workspace = true, features = ["sync", "time", "rt"] }
# The channel frame seal: AES-256-GCM and ChaCha20-Poly1305 through `ring`,
# which does not build for wasm32-unknown-unknown.
ring       = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ndn-packet = { workspace = true, features = ["std-wasm"] }
# The same two AEADs, same wire format, from RustCrypto where `ring` is absent.
aes-gcm           = { version = "0.10", default-features = false, features = ["aes"] }
chacha20poly1305  = { version = "0.10", default-features = false }
tokio      = { workspace = true, features = ["sync"] }

# Native tests check `ring`'s frames against RustCrypto's: the wasm32 seal.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
aes-gcm           = { version = "0.10", default-features = false, features = ["aes"] }
chacha20poly1305  = { version = "0.10", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
# The durability cases restart a node on both on-disk engines after a
# simulated power loss.
ndn-sync = { workspace = true, features = ["store-fjall", "store-redb"] }
tempfile = "3"
proptest = { workspace = true }
# Scoped adoption tests adopt as the hosts do, `ndn_cert::adopt_scoped`.
ndn-cert = { workspace = true }
# The cluster of nodes the API tests and the benchmark run over one forwarder.
ndn-engine = { workspace = true }
# `sync_group::carry` runs a namespace's sync group on the cluster's engine;
# the devices' faces end with their cancellation token.
ndn-namespace = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
