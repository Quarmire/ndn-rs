[package]
name = "ndn-heap"
description = "The data layer: one hash-chained log per (writer, space), membership as an operation fold, epoch keys, direct fetch of the entry a sync notice names, one newest-wins register, and durability by sequence reservation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-foundation-types = { workspace = true, features = ["std"] }
ndn-tlv      = { workspace = true, features = ["std"] }
ndn-app      = { workspace = true }
ndn-security = { workspace = true }
ndn-sync     = { workspace = true }
bytes        = { workspace = true, features = ["std"] }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
parking_lot  = { workspace = true }
sha2         = { workspace = true }
hkdf         = { workspace = true }
# Signal keys (spec §11) are zeroed when dropped.
zeroize      = "1"
getrandom    = { workspace = true }
tracing      = { workspace = true }
web-time     = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-packet = { workspace = true, features = ["std"] }
# `rt`: the store's flush runs on the blocking pool (`spawn_blocking`).
tokio      = { workspace = true, features = ["sync", "time", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ndn-packet = { workspace = true, features = ["std-wasm"] }
tokio      = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
# The durability cases restart a node on both on-disk engines after a
# simulated power loss.
ndn-sync = { workspace = true, features = ["store-fjall", "store-redb"] }
tempfile = "3"
proptest = { workspace = true }
# Scoped adoption tests adopt as the hosts do, `ndn_cert::adopt_scoped`.
ndn-cert = { workspace = true }
# The cluster of nodes the API tests and the benchmark run over one forwarder.
ndn-engine = { workspace = true }

[features]
# Construction gates: a module under construction is compiled only with its
# own feature, so a sibling's half-written module never breaks the build.
# Each gate is removed when its module lands; none remains at the stage's end.
wip-wire = []
wip-store = []
wip-reserve = []
wip-log = []
wip-trust = []
wip-seal = []
wip-sync = []
wip-fetch = []
wip-serve = []
wip-heard = []
wip-face-up = []
wip-pieces = []
wip-register = []
wip-node = []
wip-space = []
wip-signal = []
wip-revocation = []
wip-test-kit = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
