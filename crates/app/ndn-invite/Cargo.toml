[package]
name = "ndn-invite"
description = "Introductions: a stranger joins a space of the data layer (ndn-heap) by a one-use code: the offer, the ask, the answer, hint records, short codes, grants and departures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-heap     = { workspace = true }
ndn-foundation-types = { workspace = true, features = ["std"] }
ndn-tlv      = { workspace = true, features = ["std"] }
ndn-app      = { workspace = true }
ndn-security = { workspace = true }
ndn-sync     = { workspace = true }
# The code is an `ndn-trust://intro` link.
ndn-trust-envelope = { workspace = true }
bytes        = { workspace = true, features = ["std"] }
thiserror    = { workspace = true }
futures      = { workspace = true }
sha2         = { workspace = true }
parking_lot  = { workspace = true }
hkdf         = { workspace = true }
# An ask's and an answer's proof of the offer's secret.
hmac         = "0.13"
# A code's fingerprint is compared in constant time.
subtle       = "2"
# The offer's secret and the code's words are zeroed when dropped.
zeroize      = "1"
getrandom    = { workspace = true }
tracing      = { workspace = true }
web-time     = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-packet = { workspace = true, features = ["std"] }
# `rt`: the store's flush runs on the blocking pool (`spawn_blocking`).
tokio      = { workspace = true, features = ["sync", "time", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ndn-packet = { workspace = true, features = ["std-wasm"] }
tokio      = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
# The test kit: devices over one forwarder (as ndn-heap's cluster), a face that delivers nothing.
async-trait   = { workspace = true }
ndn-engine    = { workspace = true }
ndn-namespace = { workspace = true }
tokio-util    = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
