[package]
name = "ndn-data"
description = "Data layer: named, signed, versioned data — the contract (model types, the seven verbs get, put, watch, snapshot, hold, prune, share) and its reference implementation over NDN"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-foundation-types = { workspace = true, features = ["std"] }
ndn-tlv      = { workspace = true, features = ["std"] }
ndn-app      = { workspace = true }
ndn-security = { workspace = true }
ndn-sync     = { workspace = true }
bytes        = { workspace = true, features = ["std"] }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
futures      = { workspace = true }
futures-core = { version = "0.3", default-features = false, features = ["alloc"] }
parking_lot  = { workspace = true }
sha2         = { workspace = true }
hkdf         = { workspace = true }
tracing      = { workspace = true }
web-time     = { workspace = true }
yrs          = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-packet = { workspace = true, features = ["std"] }
tokio      = { workspace = true, features = ["sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ndn-packet = { workspace = true, features = ["std-wasm"] }
tokio      = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
