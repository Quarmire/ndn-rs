[package]
name = "ndn-manifest"
description = "NDF calculus kernel: the frozen 32-term model (V0.2), the canonical wire codec (rules R1-R13), DAG/lock resolution, and the V0/T0/IM0 fixed point (pure, no_std + alloc; zero dependencies; sans-IO)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[features]
# This crate is `#![no_std]` with `alloc` (documents are trees; the codec
# builds byte vectors). There is deliberately no feature surface to grow
# attached to: the crate is a pure calculus, the way ndn-time is.
#
# Obligation C7 (ndf-two-cruxes / ndf-the-landing Act II): this crate carries
# ZERO ndf-* dependencies and, in fact, zero dependencies at all — SHA-256 is
# implemented in-crate (docs/keel/DECISIONS.md, D-K2). CI asserts independence
# and builds with --no-default-features.
default = []

[dependencies]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
