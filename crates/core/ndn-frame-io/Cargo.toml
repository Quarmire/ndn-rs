[package]
name = "ndn-frame-io"
description = "Backend-agnostic link-layer frame I/O for ndn-rs: the FrameIo trait, inject/capture frame types, on-air framing per FrameFormat, and reusable AF_PACKET + loopback backends. The substrate the radio faces (ndn-face-monitor-wifi) are built on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[dependencies]
ndn-radio-hal = { workspace = true }
ndn-transport = { workspace = true }
ndn-time      = { workspace = true }
bytes         = { workspace = true, features = ["std"] }
async-trait   = { workspace = true }
tokio         = { workspace = true, features = ["sync", "rt", "net", "time"] }

# AF_PACKET raw-socket backend (Linux): monitor-mode inject/capture. The
# loopback backend + the frame/radiotap codecs are platform-independent.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# Property-based coverage of the on-air (de)framing invariants.
proptest = { workspace = true }
# `#[tokio::test]` for the async loopback-bus round-trips (adds `macros` to the
# runtime the crate already depends on).
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
