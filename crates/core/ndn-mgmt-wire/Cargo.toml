[package]
name = "ndn-mgmt-wire"
description = "Shared no_std codec for NFD management wire formats (ForwarderStatus dataset), used byte-identically by the native engine and the embedded forwarder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[features]
# no_std + alloc (uses bytes::Bytes / alloc::string::String). Never gains std.
default = []

[dependencies]
ndn-tlv = { workspace = true }
ndn-foundation-types = { workspace = true }
bytes   = { workspace = true }
# Direct (not workspace-inherited) so we can set default-features = false for
# no_std (thiserror 2 supports no_std without its std feature).
thiserror = { version = "2", default-features = false }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
