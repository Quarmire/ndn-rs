[package]
name = "ndn-time"
description = "Named-time core: uncertainty-bounded time samples, clock capability/holdover, measurement provenance, the Marzullo combiner, and the soft->hard enforcement ratchet (pure, no_std, no-alloc; sans-IO)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "spec"

[features]
# This crate is `#![no_std]` and holds no allocation: the combiner operates on
# caller-provided slices so it runs on a bare-metal timekeeper. Concrete time
# sources (GNSS/RTC/NTP shims, the peer-derived source) live in the
# `ndn-time-sources` extension crate, mirroring signals-core / signal-sources.
default = []

[dependencies]

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
