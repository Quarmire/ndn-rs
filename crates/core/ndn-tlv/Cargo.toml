[package]
name = "ndn-tlv"
description = "NDN TLV encoding and decoding primitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `std` is enabled by default. Disable it to build for bare-metal targets
# (requires an allocator; configure `bytes` without std in your workspace):
#
#   ndn-tlv = { path = "...", default-features = false }

[package.metadata.scope]
classification = "spec"

[features]
default = ["std"]
std     = ["bytes/std"]

[dependencies]
bytes = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
# docs.rs builds with every feature so the full API surface (incl. feature-
# gated items) renders, and passes --cfg docsrs so `#[doc(cfg(...))]` shows the
# feature each gated item needs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
