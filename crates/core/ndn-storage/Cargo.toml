[package]
name = "ndn-storage"
description = "Pluggable async storage engine: an ordered byte key→value Backend (in-memory + fjall LSM). The substrate the named-data Repo/CS, content-addressed stores, and NDF's BlockStore build on — one engine, many data models."
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[features]
default = ["std"]
# The std surface: the async, object-safe `Backend` (boxed futures + tokio offload),
# `MemoryBackend`, the `Instrumented` decorator. On by default — turning it OFF
# (`--no-default-features`) gives a `no_std + alloc` crate with only the synchronous
# `sync` API, for MCU targets (F21).
std = ["bytes/std", "dep:async-trait", "dep:tracing"]
# Synchronous, `no_std`-friendly `SyncBackend` + a fixed in-memory engine
# (`SyncMemoryBackend`, alloc + `critical-section` mutex) — the embedded storage
# floor (an MCU has no thread pool / no `std::sync`). On std it also bridges to the
# async `Backend` via `SyncAsAsync`, so a sync engine composes with the named layer.
sync = ["dep:critical-section"]
# Embedded flash `SyncBackend` generic over `embedded-storage::NorFlash` — the HW
# seam: ndn-rs owns the engine, the board/HAL plugs the concrete chip (esp-storage,
# an STM32 HAL, …) in through the trait. `no_std`; CI-tested against a mock flash.
flash = ["sync", "dep:embedded-storage"]
# On-disk LSM backend (fjall). Off by default so wasm / in-memory builds stay lean.
# Pulls tokio for the spawn_blocking offload (centralized in the adapter).
fjall = ["std", "dep:fjall", "dep:tokio"]
# Layer-1 name→wire store over any Backend (pulls Name/TLV; keeps the core Backend
# domain-agnostic when off).
named = ["std", "dep:ndn-packet", "dep:ndn-tlv"]
# On-disk B-tree backend (redb) with real ACID transactions — for transactional /
# read-latency-sensitive models (e.g. NDF atomic multi-partition block writes).
redb = ["std", "dep:redb", "dep:tokio"]

[dependencies]
bytes = { workspace = true, default-features = false }
async-trait = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
critical-section = { version = "1", optional = true }
embedded-storage = { version = "0.3", optional = true }
fjall = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt"] }
ndn-packet = { workspace = true, optional = true, features = ["std"] }
ndn-tlv = { workspace = true, optional = true, features = ["std"] }
redb = { version = "4", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# A linkable critical-section impl so the `sync` engine's tests run on the host.
critical-section = { version = "1", features = ["std"] }
