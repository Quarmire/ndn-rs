[package]
name = "ndn-manifest-describe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runtime support for #[derive(Manifest)]: the fallible, testable helpers the generated code calls (float-loss + non-finite honesty, cardinality list-wrapping). Tool tier; leans on ndn-manifest, never depended on by it (C7)."
# [scope] = "tool". The derive (ndn-manifest-derive) generates code that calls
# THESE helpers, so the tricky logic (f64→Decimal loss, NaN refusal, the 0-or-1
# Optional encoding) is normal, tested Rust — not macro output.

[dependencies]
ndn-manifest = { path = "../../core/ndn-manifest", default-features = false }

[lints]
workspace = true
