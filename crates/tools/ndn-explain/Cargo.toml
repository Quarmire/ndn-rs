[package]
name = "ndn-explain"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Human traces for Keel matcher verdicts: FrozenDag in, labeled explanation out. Tool tier: spec crates carry law; this carries convenience."
# [scope] = "tool" — presentation only. Depends on the spec crates; is never
# depended on BY them (C7 arrows point into the spec, never out). Kept as a
# micro-crate so consumers (simulators, UIs) get the trace helper without
# dragging the conformance bench (F54).

[dependencies]
ndn-manifest = { path = "../../core/ndn-manifest", default-features = false }
ndn-render-contract = { path = "../../core/ndn-render-contract", default-features = false }

[lints]
workspace = true
