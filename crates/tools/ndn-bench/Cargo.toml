[package]
name = "ndn-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Capstan bench: compile .ndfs/.ndfm/.ndfc scripts, lint L-01..L-15, render reference cards, run conformance vectors, freeze the fixed point"
# [scope] = "tool" — std binary; the ONLY crates it leans on are the Keel's
# own spec crates. It authors and checks; it never becomes a dependency of
# the calculus (dependency arrows point INTO the spec crates, never out).

[[bin]]
name = "ndn-bench"
path = "src/main.rs"

[dependencies]
ndn-manifest = { path = "../../core/ndn-manifest", default-features = false }
ndn-render-contract = { path = "../../core/ndn-render-contract", default-features = false }
ndn-explain = { path = "../ndn-explain" }

[lints]
workspace = true
