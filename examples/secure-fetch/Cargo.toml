[package]
name = "example-secure-fetch"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The one NDN dependency: the `ndn` umbrella (package `ndn-rs-prelude`)
# re-exports the whole application surface — `use ndn::{Consumer, KeyChain};`.
ndn-rs-prelude  = { workspace = true }
tokio           = { workspace = true, features = ["rt-multi-thread", "macros"] }
anyhow          = { workspace = true }

[lints]
workspace = true
