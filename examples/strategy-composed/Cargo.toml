[package]
name = "example-strategy-composed"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The one NDN dependency: the `ndn` umbrella (package `ndn-rs-prelude`)
# covers the reach-in surface too — `use ndn::engine::ComposedStrategy;`.
ndn-rs-prelude = { workspace = true }
smallvec      = { workspace = true }
tokio         = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow        = { workspace = true }

[lints]
workspace = true
